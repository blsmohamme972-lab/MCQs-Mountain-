      - "Reply to your comment"
      - "Opt-in review reminder"
      - "Opt-in streak reminder"
    never_mass_broadcast_directly: true
    if_batch_personal_messages_needed:
      strategy: "Queue and send in small scheduled batches, e.g. <=40 outgoing Telegram requests per run"

  deep_links:
