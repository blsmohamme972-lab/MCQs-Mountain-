# 26. WEEKLY CHALLENGE
# -------------------------------------------------------------------

weekly_challenge:
  question_source: "Challenge-only questions not in public packs before close"
  answer_key: "Server-side until submission"

  flow:
    - "Start challenge"
    - "Server returns questions without answers"
    - "Student answers"
    - "One final submit request"
    - "Server grades"
    - "One submission row stored"

  anti_cheat_v1:
    - "One attempt per user"
    - "Server controls answer key"
    - "Reject impossible timing patterns"
    - "Keep prizes/competition low-stakes"

  leaderboard:
