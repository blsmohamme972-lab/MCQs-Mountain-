      - "Enable updates"
      - "Not now"

  announcement_channel:
    use_for:
      - "New books"
      - "Weekly challenge start"
      - "Challenge results"
      - "Daily quiz poll"
      - "Important corrections"
    reason: "One channel post instead of mass bot DMs"

  personal_bot_messages:
