    question_example: "https://t.me/YOUR_BOT?startapp=Q000000827"

# -------------------------------------------------------------------
# 28. SECURITY
# -------------------------------------------------------------------

security:
  telegram_init_data:
    verify_raw_init_data: true
    verify_on_every_protected_api_call: true
    check_auth_date: true
    max_age_policy_seconds: 86400
    note: "24 hours is project policy, not a Telegram-mandated universal value"
    never_trust:
      - "initDataUnsafe as authentication proof"
      - "frontend-supplied telegram_id"
      - "frontend-supplied username"

  telegram_webhook:
    secret_token_header_required: true

  secrets_server_only:
