# -------------------------------------------------------------------
# 35. FINAL ARCHITECTURE SUMMARY
# -------------------------------------------------------------------

final_architecture_summary: >
  Telegram is the doorway, identity, compact personal-sync, retention, announcement,
  moderation and admin-control layer. Cloudflare serves the Mini App and static chapter
  packs and runs one small Worker with D1 only for shared/social/challenge/publishing metadata.
  Students study from IndexedDB and do not generate a server request per answer.
  AI turns source books into schema-v2 ingestion ZIPs and audits them where the PDF is available.
  The private admin bot stores upload metadata in a D1 publish queue. A serialized GitHub Actions
  queue-drain job downloads the files from Telegram, hashes and validates them, reuses stable IDs
  through id_map, builds from the latest GitHub Release state, uploads an inactive Cloudflare
  Worker version, smoke-tests its Version URL, and only then promotes it. GitHub Release assets
  preserve the build state and per-book versions so Actions can build independently of the admin
  computer and a single book can be rolled back without reverting unrelated books. Students remain
  free; monetization targets institutions, publishers and optional support rather than core studying.