# -------------------------------------------------------------------
# 23. LEARNING FEATURES
# -------------------------------------------------------------------

learning:
  favorites: true
  mistakes_review: true
  custom_practice: true
  timed_mock: true

  fsrs:
    enabled: true
    runs_on_device: true
    server_required: false

  active_study_time:
    count_only_active_use: true
    pause_after_idle_minutes: 3
    competitive_score: false

# -------------------------------------------------------------------
# 24. COMMENTS
# -------------------------------------------------------------------

comments:
  storage: "D1"
  load_only_when_opened: true
  page_size: 20
  max_comment_characters: 1000
  max_comments_per_user_per_day: 20

  features:
    - "Text comment"
    - "One-level reply"
    - "Helpful vote"
    - "Report"
    - "Delete own comment"
    - "Pinned comment"
    - "Verified-instructor comment"

  ordering:
    - "Pinned first"
    - "Verified instructor"
    - "Helpful"
    - "Newest"

  moderation:
    dashboard_required: false
