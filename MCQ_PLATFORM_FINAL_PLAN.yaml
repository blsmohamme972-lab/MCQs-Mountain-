  later:
    - "Photo comments"
    - "Video comments"
    - "Voice comments"

# -------------------------------------------------------------------
# 25. D1 SCHEMA / INDEX RULES
# -------------------------------------------------------------------

d1:
  rule: "Every student-facing query must use a primary key or appropriate index"

  tables:
    users:
      key: "telegram_id PK"

    comments:
      indexes:
        - "INDEX(question_id, status, created_at)"
        - "INDEX(user_id, created_at)"

    votes:
      key: "PK(comment_id, user_id)"

    reports:
      indexes:
        - "INDEX(handled, created_at)"
        - "INDEX(target_type, target_id)"

    challenges:
      key: "id PK"

    submissions:
      key: "PK(challenge_id, user_id)"
      indexes:
        - "INDEX(challenge_id, score, time_ms)"

    leaderboard_cache:
      key: "cache_key PK"

    publish_queue:
      indexes:
        - "INDEX(status, created_at)"
        - "INDEX(group_key, part_index)"
    system_state:
      key: "key PK"

