<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Six-second offline educational schematic of blood clotting inside an artery.">
<title>Blood clotting inside an artery — 6 seconds</title>
<style>
:root{color-scheme:light;--bg:#edf4fb;--paper:#fff;--ink:#162d48;--muted:#526780;--teal:#087f8c;--line:#dbe5f0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;justify-content:center}
main{width:min(100%,980px);padding:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 32px rgba(22,45,72,.08);overflow:hidden}
#scene{width:100%;background:var(--bg)}
#scene svg{display:block;width:100%;height:auto}
.controls{display:grid;grid-template-columns:auto auto auto 1fr auto;gap:10px;align-items:center;padding:14px;border-top:1px solid var(--line)}
button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:700 15px system-ui,-apple-system,"Segoe UI",sans-serif;border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid rgba(8,127,140,.28);outline-offset:2px}
button.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
input[type=range]{width:100%;min-width:120px;accent-color:var(--teal)}
.time{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.educational{padding:0 16px 14px;color:var(--muted);font-size:12px}
.note{padding:0 16px 14px;color:var(--muted);font-size:13px}
@media(max-width:650px){
 main{padding:0}
 .card{border-radius:0;border-left:0;border-right:0}
 .controls{grid-template-columns:repeat(3,1fr)}
 .controls button{width:100%}
 .controls .seek-wrap{grid-column:1/-1;display:flex;gap:9px;align-items:center}
 .time{grid-column:1/-1;text-align:center}
}</style>
</head>
<body>
<main>
<section class="card" aria-label="Blood clotting inside an artery animation">
<div id="scene" aria-live="off"></div>
<div class="controls" aria-label="Playback controls">
<button class="primary" id="play" type="button">Play</button>
<button id="pause" type="button">Pause</button>
<button id="replay" type="button">Replay</button>
<label class="seek-wrap" for="seek"><span>Seek</span><input id="seek" type="range" min="0" max="6000" step="10" value="0"></label>
<output id="clock" class="time" for="seek">0.00 s / 6.00 s</output>
</div>
<div class="educational">Educational schematic — not clinically validated.</div>
<div id="motion-note" class="note"></div>
</section>
</main>
<script>
__PARTS_BUNDLE__
__SCENE_RENDERER__

'use strict';
const scene=__SCENE_JSON__;
const host=document.getElementById('scene');
const BASE_SCENE=scene;
const PLATELET_TARGETS=document.getElementById('scene');
const playBtn=document.getElementById('play');
const pauseBtn=document.getElementById('pause');
const replayBtn=document.getElementById('replay');
const seek=document.getElementById('seek');
const clock=document.getElementById('clock');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let timeMs=0,playing=false,raf=0,lastStamp=0;

MedicalMotionScene.validate(BASE_SCENE);

function clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v));}
function clampMs(v){return Math.max(0,Math.min(6000,Number(v)||0));}
function smoothstep(v){v=clamp(v);return v*v*(3-2*v);}
function lerp(a,b,t){return a+(b-a)*t;}

function sceneAt(ms){
  const p=clampMs(ms)/6000;
  const aggregate=smoothstep((p-0.04)/0.58);
  const scene=JSON.parse(JSON.stringify(BASE_SCENE));
  for(let i=0;i<4;i++){
    const c=scene.components[2+i].options;
    const t=PLATELET_TARGETS[i];
    c.x=lerp(c.x,t.x,aggregate);
    c.y=lerp(c.y,t.y,aggregate);
    c.scale=lerp(c.scale,t.scale,aggregate);
    c.opacity=lerp(c.opacity,1,aggregate);
  }
  return scene;
}

function renderAtMs(ms){
  timeMs=clampMs(ms);
  const frameScene=sceneAt(timeMs);
  host.innerHTML=MedicalMotionScene.renderSVG(frameScene,timeMs/1000);
  seek.value=String(Math.round(timeMs));
  clock.textContent=(timeMs/1000).toFixed(2)+' s / 6.00 s';
  playBtn.setAttribute('aria-pressed',playing?'true':'false');
  return host.querySelector('svg');
}
function stop(){playing=false;if(raf)cancelAnimationFrame(raf);raf=0;}
function frame(now){
  if(!playing)return;
  const delta=Math.max(0,now-lastStamp);
  lastStamp=now;
  timeMs=clampMs(timeMs+delta);
  if(timeMs>=6000){timeMs=6000;playing=false;}
  renderAtMs(timeMs);
  if(playing)raf=requestAnimationFrame(frame);
}
playBtn.addEventListener('click',()=>{
  if(playing)return;
  if(timeMs>=6000)timeMs=0;
  playing=true;
  lastStamp=performance.now();
  renderAtMs(timeMs);
  raf=requestAnimationFrame(frame);
});
pauseBtn.addEventListener('click',()=>{stop();renderAtMs(timeMs);});
replayBtn.addEventListener('click',()=>{
  stop();
  timeMs=0;
  renderAtMs(0);
  playing=true;
  lastStamp=performance.now();
  raf=requestAnimationFrame(frame);
});
seek.addEventListener('input',()=>{stop();renderAtMs(seek.value);});
document.getElementById('motion-note').textContent=reduced
  ? 'Reduced-motion preference detected. Playback remains manual.'
  : 'Playback is manual; seeking reproduces the same frame deterministically.';

window.__animationTest={
  renderAtMs,
  sceneAt,
  getTimeMs:()=>timeMs,
  isPlaying:()=>playing,
  fibrinMarkup:()=>host.querySelector('[data-part-id="fibrin-mesh"]')?.innerHTML||'',
  flowMarkup:()=>host.querySelector('[data-part-id="blood-flow"]')?.innerHTML||'',
  plateletTransforms:()=>Array.from(host.querySelectorAll('[data-part-id="platelet"]')).map(n=>n.getAttribute('transform')+'|'+n.getAttribute('opacity'))
};
renderAtMs(0);
</script>
</body>
</html>
