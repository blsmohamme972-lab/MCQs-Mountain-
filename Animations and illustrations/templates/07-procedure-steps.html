<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Procedure Steps</title><style>
body{margin:0;background:#edf5ff;display:grid;place-items:center;min-height:100vh;font-family:system-ui}.stage{width:min(92vw,520px);aspect-ratio:9/16;background:#fff;border-radius:28px;padding:34px;box-sizing:border-box}.timeline{border-left:5px solid #cfe2f3;margin-left:25px;padding-left:34px}.item{position:relative;margin:0 0 42px;opacity:.3;transition:.35s}.item:before{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#86b5df;left:-48px;top:4px}.item.on{opacity:1}.item.on:before{background:#2076bd;box-shadow:0 0 0 8px #dcecf8}.name{font-size:23px;font-weight:800;color:#123}.desc{color:#567}@media(prefers-reduced-motion:reduce){.item{transition:none}}</style></head><body>
<div class="stage"><h1 id="title"></h1><div class="timeline" id="timeline"></div></div><script>
const CONFIG={title:"Clinical Procedure",steps:[["Prepare","Patient, field, equipment"],["Identify","Confirm anatomy/target"],["Perform","Execute key maneuver"],["Verify","Check endpoint and safety"],["Finish","Secure, document, aftercare"]]};
title.textContent=CONFIG.title;CONFIG.steps.forEach((s,i)=>timeline.insertAdjacentHTML("beforeend",`<div class="item" id="i${i}"><div class="name">${i+1}. ${s[0]}</div><div class="desc">${s[1]}</div></div>`));CONFIG.steps.forEach((_,i)=>setTimeout(()=>document.getElementById("i"+i).classList.add("on"),i*700));
</script></body></html>
