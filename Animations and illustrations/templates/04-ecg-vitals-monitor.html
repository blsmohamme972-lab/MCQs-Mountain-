<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECG Vitals Monitor</title><style>
body{margin:0;background:#0b1119;display:grid;place-items:center;min-height:100vh;font-family:ui-monospace,monospace;color:#d9ffe9}.monitor{width:min(92vw,620px);aspect-ratio:9/16;background:#071018;border-radius:28px;padding:34px;box-sizing:border-box;border:4px solid #263746}.row{display:flex;justify-content:space-between;align-items:end}.big{font-size:72px;font-weight:800}.small{font-size:22px}.ecg{width:100%;margin-top:60px}.trace{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.4s linear infinite}@keyframes draw{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none;stroke-dashoffset:0}}</style></head><body>
<div class="monitor"><div class="row"><div><div class="small">HR</div><div class="big" id="hr"></div></div><div><div class="small">SpO₂</div><div class="big" id="spo2"></div></div></div>
<svg class="ecg" viewBox="0 0 900 300"><path d="M0 160H90l35-5 22-55 28 135 35-100 25 25h95l30-4 25-60 28 140 35-102 28 26h190l30-4 25-60 28 140 35-102 28 26H900" fill="none" stroke="#57f287" stroke-width="7" class="trace"/></svg><div class="small" id="caption"></div></div><script>
const CONFIG={hr:78,spo2:98,caption:"Reusable ECG + vital signs display"};hr.textContent=CONFIG.hr;spo2.textContent=CONFIG.spo2+"%";caption.textContent=CONFIG.caption;
</script></body></html>
