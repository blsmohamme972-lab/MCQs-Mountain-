<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medical Process Flow</title><style>
body{margin:0;background:#edf5ff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.stage{width:min(92vw,520px);aspect-ratio:9/16;background:#fff;border-radius:28px;padding:34px;box-sizing:border-box;overflow:hidden;box-shadow:0 16px 50px #1232}h1{margin:0 0 35px;color:#123}.step{opacity:.28;transform:translateY(12px);transition:.45s;margin:0 auto 24px;padding:24px;border-radius:22px;background:#f3f8fd;border:2px solid #d7e7f6}.step.on{opacity:1;transform:none;border-color:#3182ce}.n{font-weight:800;color:#2472b8}.arrow{text-align:center;font-size:30px;color:#3986c8;margin:-14px 0 4px}@media(prefers-reduced-motion:reduce){.step{transition:none}}</style></head><body>
<div class="stage"><h1 id="title"></h1><div id="steps"></div></div><script>
const CONFIG={title:"Pathophysiology",steps:[["Trigger","Initial cause"],["Mechanism","Key biological change"],["Effect","Clinical consequence"],["Outcome","Final teaching point"]],interval:900};
title.textContent=CONFIG.title;const root=document.getElementById("steps");CONFIG.steps.forEach((s,i)=>{root.insertAdjacentHTML("beforeend",`<div class="step" id="s${i}"><div class="n">${i+1}. ${s[0]}</div><div>${s[1]}</div></div>${i<CONFIG.steps.length-1?'<div class="arrow">↓</div>':''}`)});
let i=0;function play(){if(i<CONFIG.steps.length){document.getElementById("s"+i).classList.add("on");i++;setTimeout(play,CONFIG.interval)}}play();
</script></body></html>
