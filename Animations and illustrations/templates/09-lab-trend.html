<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab Trend</title><style>
body{margin:0;background:#f1f6fb;display:grid;place-items:center;min-height:100vh;font-family:system-ui}.stage{width:min(92vw,520px);aspect-ratio:9/16;background:#fff;border-radius:28px;padding:34px;box-sizing:border-box}.value{font-size:70px;font-weight:900;color:#174d7a}.chart{margin-top:55px;width:100%}.line{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.4s forwards}@keyframes draw{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.line{animation:none;stroke-dashoffset:0}}</style></head><body>
<div class="stage"><h1 id="title"></h1><div class="value" id="value"></div><div id="unit"></div><svg class="chart" viewBox="0 0 800 420"><rect x="60" y="80" width="680" height="220" rx="20" fill="#eaf6ee"/><line x1="60" y1="300" x2="740" y2="300" stroke="#9fb4c7" stroke-width="3"/><line x1="60" y1="80" x2="60" y2="300" stroke="#9fb4c7" stroke-width="3"/><polyline id="trend" class="line" fill="none" stroke="#2c75b7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg><h3 id="message"></h3></div><script>
const CONFIG={title:"Laboratory Trend",value:8.6,unit:"mg/dL",points:[260,240,215,180,145,120],message:"Animate direction, threshold, and interpretation."};title.textContent=CONFIG.title;value.textContent=CONFIG.value;unit.textContent=CONFIG.unit;message.textContent=CONFIG.message;trend.setAttribute("points",CONFIG.points.map((y,i)=>`${80+i*125},${y}`).join(" "));
</script></body></html>
