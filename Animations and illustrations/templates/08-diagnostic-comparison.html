<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostic Comparison</title><style>
body{margin:0;background:#eef4fa;display:grid;place-items:center;min-height:100vh;font-family:system-ui}.stage{width:min(94vw,620px);aspect-ratio:9/16;background:white;border-radius:28px;padding:30px;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{border:2px solid #dce8f2;border-radius:22px;padding:18px;min-height:290px}.dot{width:78px;height:78px;border-radius:50%;margin:18px auto}.a .dot{background:#75b8e7}.b .dot{background:#ea7b86}.row{padding:12px 0;border-bottom:1px solid #e9eff5}.key{font-weight:800}.winner{outline:4px solid #f5b642;animation:pop .7s ease}@keyframes pop{50%{transform:scale(1.03)}}@media(prefers-reduced-motion:reduce){.winner{animation:none}}</style></head><body>
<div class="stage"><h1 id="title"></h1><div class="grid"><div class="card a" id="left"></div><div class="card b" id="right"></div></div><h3 id="takeaway"></h3></div><script>
const CONFIG={title:"Diagnostic Comparison",left:{name:"Condition A",features:["Feature 1","Feature 2","Feature 3"]},right:{name:"Condition B",features:["Feature 1","Feature 2","Feature 3"]},highlight:"right",takeaway:"Emphasize the discriminating feature."};
function card(x){return `<div class="dot"></div><h2>${x.name}</h2>${x.features.map(v=>`<div class="row">${v}</div>`).join("")}`}title.textContent=CONFIG.title;left.innerHTML=card(CONFIG.left);right.innerHTML=card(CONFIG.right);document.getElementById(CONFIG.highlight).classList.add("winner");takeaway.textContent=CONFIG.takeaway;
</script></body></html>
