<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCQs Mountain</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
--primary:#5B4CFF;--primary-strong:#4336D8;--primary-soft:#E8E5FF;--on-primary:#FFFFFF;--accent-a:#FFB703;--accent-b:#00AFA0;
--bg:#FFF8E8;--surface:#FFFFFF;--surface-alt:#FFF0CC;--text:#182032;--muted:#526079;--border:#CAD2E3;--outline:#182032;--shadow:#182032;
--success:#177D4E;--success-soft:#DDF6E9;--error:#C93E4A;--error-soft:#FFE5EB;--warning:#9A5800;--warning-soft:#FFE7B1;--focus:#2D67F6;
--ink:#182032;--scrim:rgba(24,32,50,.32);--hud-bg:rgba(255,255,255,.92);--strip-rock:#7A5E4C;--strip-grass:#5BC46B;--world-night:0;
--r-xs:8px;--r-sm:12px;--r-md:16px;--r-lg:22px;--r-xl:30px;--r-pill:999px;
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
--d-q:80ms;--d-fast:120ms;--d-base:180ms;--d-delight:320ms;--ease-out:cubic-bezier(.2,.8,.2,1);--ease-press:cubic-bezier(.2,0,.1,1);--ease-in:cubic-bezier(.4,0,1,1);
--fd:"Fredoka",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
--fr:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--primary:#6A4CFF;--primary-strong:#5034D8;--primary-soft:#302D60;--accent-a:#FFD166;--accent-b:#45D7C8;
--bg:#111522;--surface:#1B2132;--surface-alt:#272E44;--text:#F8F7FF;--muted:#BEC5D8;--border:#46506B;--outline:#FFFFFF1F;--shadow:#05070C;
--success:#65D998;--success-soft:#173F2C;--error:#FF818C;--error-soft:#4A1A2E;--warning:#FFD166;--warning-soft:#493A18;--focus:#8FB7FF;
--ink:#05070C;--scrim:rgba(5,7,12,.5);--hud-bg:rgba(27,33,50,.92);--strip-rock:#4A3A33;--strip-grass:#3BA862;--world-night:1;
color-scheme:dark}}
:root[data-theme="dark"]{
--primary:#6A4CFF;--primary-strong:#5034D8;--primary-soft:#302D60;--accent-a:#FFD166;--accent-b:#45D7C8;
--bg:#111522;--surface:#1B2132;--surface-alt:#272E44;--text:#F8F7FF;--muted:#BEC5D8;--border:#46506B;--outline:#FFFFFF1F;--shadow:#05070C;
--success:#65D998;--success-soft:#173F2C;--error:#FF818C;--error-soft:#4A1A2E;--warning:#FFD166;--warning-soft:#493A18;--focus:#8FB7FF;
--ink:#05070C;--scrim:rgba(5,7,12,.5);--hud-bg:rgba(27,33,50,.92);--strip-rock:#4A3A33;--strip-grass:#3BA862;--world-night:1;
color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 var(--fr);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
#world{position:fixed;left:0;top:0;width:100%;height:100%;touch-action:manipulation;background:var(--bg)}
#world canvas{position:absolute;left:0;top:0;width:100%!important;height:100%!important;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;margin:0}
button:focus{outline:3px solid var(--focus);outline-offset:2px}
button:focus:not(:focus-visible){outline:none}
h2[tabindex]:focus{outline:none}
svg{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:8px;padding-top:calc(8px + env(safe-area-inset-top,0px));pointer-events:none}
#hud>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:6px;min-height:38px;padding:7px 12px;font:600 15px/1 var(--fd);white-space:nowrap;background:var(--hud-bg);border:2px solid var(--outline);border-radius:var(--r-pill);box-shadow:0 3px 0 var(--shadow)}
.coin{width:16px;height:16px;border-radius:50%;background:var(--accent-a);border:2px solid var(--ink);box-shadow:inset -2px -2px 0 rgba(0,0,0,.18)}
#snd{margin-left:auto;width:44px;height:44px;display:grid;place-items:center;padding:0;background:var(--hud-bg);border:2px solid var(--outline);border-radius:50%;box-shadow:0 3px 0 var(--shadow)}
#snd svg{width:22px;height:22px;stroke-width:2.4}
#snd .w{display:none}#snd[aria-pressed=true] .w{display:inline}#snd[aria-pressed=true] .x{display:none}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;padding:10px 16px;border:2px solid var(--outline);border-radius:var(--r-md);background:var(--primary);color:var(--on-primary);font:800 17px/1.2 var(--fr);box-shadow:0 5px 0 var(--primary-strong);transition:transform var(--d-q) var(--ease-press),box-shadow var(--d-q) var(--ease-press)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--primary-strong)}
.btn:disabled{background:var(--surface-alt);color:var(--muted);box-shadow:0 5px 0 var(--border);cursor:default;transform:none}
.card{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:560px;margin:0 auto;padding-top:20px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--surface);border:2px solid var(--outline);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -6px 24px var(--scrim);transition:transform var(--d-base) var(--ease-out),opacity var(--d-base) linear}
.card.off{transform:translateY(calc(100% + 12px));opacity:0;visibility:hidden;pointer-events:none;transition:transform 140ms var(--ease-in),opacity 140ms linear,visibility 0s 140ms}
h1,.card h2{font:600 28px/1.15 var(--fd);margin:0}
.sub{margin:4px 0 16px;color:var(--muted);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--surface-alt);border:2px solid var(--outline);border-radius:var(--r-md)}
.seg button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:6px 2px;background:transparent;border:2px solid transparent;border-radius:var(--r-sm)}
.seg b{font:600 17px/1.1 var(--fd)}.seg small{font:700 12px/1.2 var(--fr);color:var(--muted)}
.seg [aria-pressed=true]{background:var(--surface);border-color:var(--outline);box-shadow:0 3px 0 var(--shadow)}
.mdesc{margin:10px 2px 18px;min-height:3em;font-size:14px;color:var(--muted)}
.go{min-height:62px;font:600 22px/1 var(--fd)}
.go .bob{display:inline-flex;align-items:center;gap:10px}
.ready .go .bob{animation:bob 1.5s ease-in-out infinite}
.go .ld{display:none;font:700 16px/1 var(--fr)}
:root:not(.ready) .go .bob{display:none}:root:not(.ready) .go .ld{display:inline}
.go svg{width:26px;height:26px;stroke-width:3.4}
@keyframes bob{50%{transform:translate(3px,-3px)}}
#skip{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:3;padding:10px 16px;font:800 14px/1 var(--fr);background:var(--hud-bg);border:2px solid var(--outline);border-radius:var(--r-pill);box-shadow:0 3px 0 var(--shadow);transform:translate(-50%,8px);opacity:0;pointer-events:none;transition:opacity var(--d-fast) linear,transform var(--d-fast) var(--ease-out)}
#skip.on{opacity:1;transform:translate(-50%,0)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:4;height:76%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--outline);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -6px 24px var(--scrim);transform:translateY(calc(100% + 12px));opacity:0;visibility:hidden;pointer-events:none;will-change:transform;transition:transform 140ms var(--ease-in),opacity 140ms linear,visibility 0s 140ms}
#sheet.open{transform:none;opacity:1;visibility:visible;pointer-events:auto;transition:transform 200ms var(--ease-out),opacity 200ms linear,visibility 0s}
.m-strip #sheet,.m-classic #sheet{height:auto;top:calc(62px + env(safe-area-inset-top,0px))}
.m-classic #sheet,.rm #sheet,.rm .card,.rm .page{transition:none!important}
#stripW{flex:none;height:56px;overflow:hidden;border-radius:20px 20px 0 0;border-bottom:2px solid var(--outline);background:linear-gradient(#8FD3FF,#D9F1FF)}
:root[data-theme="dark"] #stripW{background:linear-gradient(#1A2240,#2C3A63)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #stripW{background:linear-gradient(#1A2240,#2C3A63)}}
#strip{display:block;width:100%;height:56px;image-rendering:pixelated}
.t-hd #world canvas,.t-hd #strip{image-rendering:auto}
.t-hd .page{-webkit-mask-image:linear-gradient(transparent,#000 14px);mask-image:linear-gradient(transparent,#000 14px)}
#bar{flex:none;height:12px;margin:14px 16px 0;overflow:hidden;background:var(--surface-alt);border:2px solid var(--outline);border-radius:var(--r-pill)}
#bar i{display:block;height:100%;background:var(--primary);transform-origin:0 50%;transform:scaleX(0)}
.m-story #stripW,.m-story #bar,.m-classic #stripW,.m-strip #bar{display:none}
.pages{position:relative;flex:1;min-height:0}
.page{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;opacity:0;visibility:hidden}
.page.on{opacity:1;visibility:visible}
.m-strip .page{transition:opacity var(--d-fast) linear,visibility 0s var(--d-fast)}
.m-strip .page.on{transition:opacity var(--d-fast) linear,visibility 0s}
.in{padding-top:16px;padding-bottom:24px}
.qhead{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.qn{margin:0;font:600 22px/1.2 var(--fd)}
.chip{padding:6px 10px;font:800 13px/1 var(--fr);background:var(--primary-soft);border-radius:var(--r-pill)}
.qxp{margin-left:auto;font:600 15px/1 var(--fd);color:var(--muted)}
.lead{margin:0 0 8px;font-size:15px;color:var(--muted)}
.stem{margin:0 0 14px;font-size:17px;font-weight:700;line-height:1.55}
.hint{margin:-6px 0 12px;font-size:14px;font-weight:700;color:var(--muted)}
.hint.warn{color:var(--warning)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 12px;text-align:left;font:600 16px/1.4 var(--fr);background:var(--surface);border:2px solid var(--border);border-radius:var(--r-sm)}
.opt .l{flex:none;display:grid;place-items:center;width:30px;height:30px;font:800 15px/1 var(--fr);background:var(--surface-alt);border-radius:var(--r-xs)}
.opt .t{flex:1;min-width:0}
.opt.sel,.tfb.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.sel .l{background:var(--primary);color:var(--on-primary)}
.opt.ok,.tfb.ok{border-color:var(--success);background:var(--success-soft)}
.opt.no,.tfb.no{border-color:var(--error);background:var(--error-soft)}
.opt:disabled,.tfb:disabled{cursor:default;color:var(--text)}
.mk{display:none;flex:none;align-items:center;gap:4px;font:800 13px/1.2 var(--fr);text-align:right;white-space:nowrap}
.mk svg{width:16px;height:16px;flex:none}
.ok .mk,.no .mk,.mk.okc,.mk.noc{display:flex}
.ok .mk,.mk.okc{color:var(--success)}.no .mk,.mk.noc{color:var(--error)}
.mrow{display:grid;gap:8px;padding:10px 12px;border:2px solid var(--border);border-radius:var(--r-sm)}
.mt{margin:0;font-weight:700}
.tf{display:flex;gap:8px}
.tfb{flex:1;min-height:44px;font:800 15px/1 var(--fr);background:var(--surface);border:2px solid var(--border);border-radius:var(--r-sm)}
.fb{display:flex;align-items:flex-start;gap:10px;margin:16px 0 0;padding:12px;border:2px solid currentColor;border-radius:var(--r-md)}
.fb svg{flex:none;width:24px;height:24px;margin-top:1px}
.fb.good{background:var(--success-soft);color:var(--success)}.fb.soft{background:var(--warning-soft);color:var(--warning)}
.fb b{display:block;font:800 17px/1.3 var(--fr)}.fb span{color:var(--text);font-size:15px;font-weight:700}
.exp h3{margin:18px 0 6px;font:600 17px/1.2 var(--fd)}.exp p{margin:0;line-height:1.65}
.row{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;margin-top:12px;padding:10px 14px;text-align:left;font:800 15px/1.2 var(--fr);background:var(--surface-alt);border:2px solid var(--border);border-radius:var(--r-sm)}
.row:after{content:"";width:8px;height:8px;border:solid currentColor;border-width:0 3px 3px 0;transform:rotate(45deg)}
.row[aria-expanded=true]:after{transform:rotate(-135deg)}
.ph{margin:6px 0 0;padding:10px 14px;font-size:14px;color:var(--muted);background:var(--surface-alt);border-radius:var(--r-sm)}
.foot{flex:none;padding-top:12px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--border)}
.big{margin:8px 0 12px;font:600 20px/1.3 var(--fd)}
.stats{margin:0 0 18px;padding:0;list-style:none;font-weight:700}
.stats li{padding:8px 0;border-bottom:2px solid var(--border)}
.stats li:last-child{border:0}
#dbg{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(60px + env(safe-area-inset-top,0px));z-index:7;padding:6px 8px;font:12px/1.35 ui-monospace,Menlo,monospace;white-space:pre;color:var(--text);background:var(--surface);border:2px solid var(--outline);border-radius:var(--r-xs);pointer-events:none}
@media (prefers-reduced-motion:reduce){.ready .go .bob{animation:none}}
.rm.ready .go .bob{animation:none}
</style>
</head>
<body>
<div id="world" role="img" aria-label="MCQs Mountain: a climber moves up one ledge per question"></div>
<header id="hud" class="wrap">
<div class="pill" id="xpP"><i class="coin" aria-hidden="true"></i><span><b id="xpN">0</b> XP</span></div>
<div class="pill" id="ledge">Ledge 0/8</div>
<button id="snd" type="button" aria-pressed="false" aria-label="Sound and music"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M17 9.5l5 5M22 9.5l-5 5"/></svg></button>
</header>
<div id="dbg" hidden></div>
<div id="skip" aria-hidden="true">Tap to skip</div>
<section id="startp" class="card wrap" aria-labelledby="t1">
<h1 id="t1">MCQs Mountain</h1>
<p class="sub">Sample chapter · 8 MCQs</p>
<div class="seg" role="group" aria-label="Mode">
<button type="button" data-m="story"><b>Story</b><small>Walk and climb</small></button>
<button type="button" data-m="strip"><b>Strip</b><small>Mini climber</small></button>
<button type="button" data-m="classic"><b>Classic</b><small>No game</small></button>
</div>
<p class="mdesc" id="mdesc"></p>
<button type="button" class="btn go" id="go" data-lab="go" disabled><span class="bob">First MCQ<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg></span><span class="ld">Loading the mountain…</span></button>
</section>
<section id="sheet" aria-label="Question">
<div id="stripW"><canvas id="strip" aria-hidden="true"></canvas></div>
<div id="bar" aria-hidden="true"><i></i></div>
<div class="pages" id="pages"><div class="page" id="pA"></div><div class="page" id="pB"></div></div>
<div class="foot wrap"><button type="button" class="btn" id="check" disabled>Check answer</button><button type="button" class="btn" id="next" data-lab="next" hidden>Next MCQ</button></div>
</section>
<section id="done" class="card wrap off" aria-labelledby="t2">
<h2 id="t2" tabindex="-1">Summit reached</h2>
<p class="big" id="dS"></p>
<ul class="stats" id="dL"></ul>
<button type="button" class="btn" id="again">Climb again</button>
</section>
<div id="live" class="sr" aria-live="polite"></div>
<script>
/* Where each tier's scripts and test art come from. The repo copy uses the pinned engine and filters fetched by
   tools/fetch_engine.py and the art and sound built by tools/fetch_assets.py; the phone (artifact) copy made by
   tools/make_artifact.py swaps these for cdnjs (with integrity hashes and a jsDelivr fallback) and its own files. */
window.LAB_CONFIG = {
  light: { scripts: ['../vendor/pixi-8.22.0.min.js', 'world.js'], assetBase: '../assets-test/build/' },
  hd: { scripts: ['../vendor/pixi-8.22.0.min.js', '../vendor/pixi-filters-6.1.5.js', 'world-hd.js'], assetBase: '../assets-test/build-hd/' },
  soundBase: '../assets-test/build-hd/',
  sounds: { music: 'music.mp3', coin: 'coin.mp3', coin2: 'coin2.mp3', jump: 'jump.mp3', land: 'land.mp3', step: 'step.mp3', lift: 'lift.mp3', tap: 'tap.mp3', correct: 'correct.mp3', soft: 'soft.mp3', cheer: 'cheer.mp3', flag: 'flag.mp3' }
};
</script>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
