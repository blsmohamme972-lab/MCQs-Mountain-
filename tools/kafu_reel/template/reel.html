<html><head><meta charset="utf-8">

<style>

.hl{position:absolute;border-radius:10px;box-shadow:0 0 0 2px rgba(255,213,74,.95),0 0 24px rgba(255,213,74,.55);background:rgba(255,213,74,.10)}

#endcta{left:0;right:0;top:1325px;display:flex;flex-direction:column;align-items:center;gap:12px}
.pill{padding:12px 46px;border-radius:999px;font-family:Cairo,sans-serif;font-weight:800;font-size:46px;line-height:1.35;direction:rtl}

.mini{position:absolute;width:418px;height:940px;transform-origin:209px 470px}

#flash{inset:0;background:#fff;opacity:0;z-index:100;pointer-events:none}

<script>

 let i=0;while(i<keys.length-1&&keys[i+1].t<=t)i++;const a=keys[i],b=keys[i+1],p=(EASE[b.ease||'io'])(seg(t,a.t,b.t)),o={};

$('endiqt').textContent=R.text.end_iraqi;$('endtag').innerHTML=R.text.end_tag;$('endtagar').textContent=R.text.end_tag_ar;

 d.append(doc,f0,fN);$('screens').appendChild(d);SC[name]={el:d,doc,ov,f0,fN,spec:s,hls:[]};
 (s.highlights||[]).forEach(h=>{const e=document.createElement('div');e.className='hl';Object.assign(e.style,{left:(h.x-6)+'px',top:(h.y-4)+'px',width:(h.w+12)+'px',height:(h.h+8)+'px'});ov.appendChild(e);SC[name].hls.push({el:e,h})});
 if(s.pulse){const e=document.createElement('div');e.className='pulse';Object.assign(e.style,{left:(s.pulse.x-34)+'px',top:(s.pulse.y-34)+'px',width:'68px',height:'68px'});ov.appendChild(e);SC[name].pulse=e}
}

let lessonFrame=null;
if(R.lesson){const P=SC[R.lesson.screen],st=R.lesson.stage;
 lessonFrame=document.createElement('iframe');lessonFrame.className='lesson';lessonFrame.setAttribute('sandbox','allow-scripts');
 Object.assign(lessonFrame.style,{left:st.x+'px',top:st.y+'px',width:st.w+'px',height:st.h+'px'});P.ov.appendChild(lessonFrame);lessonFrame.src=R.lesson.src;
 const o=R.lesson.output,t=document.createElement('div');t.className='ptime';
 Object.assign(t.style,{left:o.x+'px',top:o.y+'px',width:o.w+'px',height:o.h+'px',font:`${o.weight} ${o.size} ${o.font}`,color:o.color,lineHeight:o.h+'px',textAlign:'right'});
 P.ov.appendChild(t);P.time=t;
 const r=R.lesson.range,rg=document.createElement('div');rg.className='prange';Object.assign(rg.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'});
 rg.innerHTML=`<div class="tr" style="background:${R.lesson.colors.track};opacity:.35"></div><div class="fi" style="background:${R.lesson.colors.thumb}"></div><div class="th" style="background:${R.lesson.colors.thumb};box-shadow:0 0 0 3px rgba(255,255,255,.9)"></div>`;
 P.ov.appendChild(rg);P.range=rg;
 // while the card loads it must be on screen: Chromium throttles a hidden or off-screen cross-origin frame, and the card

 P.doc.style.transform=`translateY(${-R.lesson.sy}px)`;P.el.style.zIndex=99}
let port=null,pending=null,lessonDone=null;window.lessonReady=false;window.lessonErrors=[];
const lessonLoaded=new Promise(res=>{lessonDone=res;if(!R.lesson)res()});
addEventListener('message',ev=>{const m=ev.data;if(!lessonFrame||ev.source!==lessonFrame.contentWindow||!m||m.type!=='kafu-motioncards-ready')return;
 const ch=new MessageChannel();port=ch.port1;port.onmessage=e=>{const x=e.data;
  if(x.type==='ready'){window.lessonReady=true;lessonDone()}
  else if(x.type==='error'){window.lessonErrors.push('card error');lessonDone();if(pending)pending.rej(new Error('card_error'))}
  else if((x.type==='state'||x.type==='ended')&&pending&&x.time_ms===pending.ms){const p=pending;pending=null;p.res(x.type)}};

// kinetic texts
const TX=R.texts.map(x=>{const box=document.createElement('div');box.className='kt';box.style.top=x.y+'px';const words=[];
 x.rows.forEach(r=>{const row=document.createElement('div');row.className='row'+(r.ar?' ar':'');row.style.fontSize=r.size+'px';row.style.color=r.color||'#fff';
  if(r.mt)row.style.marginTop=r.mt+'px';
  r.text.split(' ').forEach(w=>{const s=document.createElement('span');s.className='w';const hl=(r.hl||[]).includes(w.replace(/[.,!…]/g,''));
   s.textContent=w;if(hl)s.style.color=r.hlColor||'var(--gold)';row.appendChild(s);words.push({el:s,i:words.length})});box.appendChild(row)});
 $('texts').appendChild(box);return{x,box,words}});
// book covers (the opening montage); each word punches in from PUNCH x its size
const PUNCH=1.2;
const COV=(R.covers||[]).map((c,i)=>{const d=document.createElement('div');d.className='cover';d.style.backgroundImage=`url(${c.file})`;$('deck').appendChild(d);return{d,c}});
// flag canvases
const FW=1180,FH=787,FS=2,fsrc=document.createElement('canvas');fsrc.width=FW*FS;fsrc.height=FH*FS;let flagReady=false;
const fimg=new Image();fimg.src='img/flag_iq.svg';
const flagLoad=fimg.decode().then(()=>{const c=fsrc.getContext('2d');c.drawImage(fimg,0,0,FW*FS,FH*FS);
 const nz=document.createElement('canvas');nz.width=FW*FS;nz.height=FH*FS;const nc=nz.getContext('2d'),g=nc.createImageData(FW*FS,FH*FS),d=g.data;let s=7;
 for(let i=0;i<d.length;i+=4){s=(s*16807)%2147483647;const v=s/2147483647>.5?255:0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=10}nc.putImageData(g,0,0);c.drawImage(nz,0,0);flagReady=true});
function drawFlag(ctx,W,H,t,dim,amp0){ctx.clearRect(0,0,W,H);if(!flagReady)return;const top=(H-FH)/2,sx=W/FW;
 for(let x=0;x<W;x++){const u=x/W,amp=(8+30*u)*amp0,ph=u*Math.PI*3.2-t*6.5,dy=amp*Math.sin(ph)+5*u*amp0*Math.sin(u*14-t*10),sl=Math.cos(ph)*(0.35+0.65*u),sy=1+0.012*amp0*Math.cos(ph),h=FH*sy;

  ctx.fillStyle=sl>0?`rgba(255,255,255,${0.2*sl*amp0})`:`rgba(0,0,0,${-0.42*sl*amp0})`;ctx.fillRect(x,top+dy+(FH-h)/2,1,h)}

const fctx=$('flagc').getContext('2d'),fbctx=$('flagbgc').getContext('2d');
// end-card mini phones (clones of real screens)
const minis=(R.end.phones||[]).map(m=>{const ph=document.createElement('div');ph.className='mini';
 ph.innerHTML=`<div class="abs" style="left:30px;top:60px;width:358px;height:860px;border-radius:70px;background:rgba(0,0,0,.6);filter:blur(42px)"></div><div class="abs" style="inset:0;border-radius:68px;padding:14px;background:linear-gradient(145deg,#6d7380,#262a31 18%,#0f1115 48%,#22252c 82%,#7b818e);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),inset 0 0 0 7px #050608">
 <div style="position:relative;width:390px;height:912px;border-radius:54px;overflow:hidden;background:${R.screens[m.screen].bg}"><div style="position:absolute;left:132px;top:11px;width:126px;height:36px;border-radius:20px;background:#000;z-index:3"></div>

// ---------- frame

 // book covers slam in over the dimmed flag, then fall into the phone
 let shake=0,flashK=0,wi=-1;

  const sc=lerp(1.45,1,EASE.out5(p))*(1-.06*Math.min(depth,4))*lerp(1,.12,ce);

  if(t>=a&&t<a+.12){shake=Math.max(shake,1-(t-a)/.12);flashK=Math.max(flashK,.2*(1-(t-a)/.12))}if(t>=a)wi=i});
 // the book's word, gone before the phone flies up through it

 if(wv>0){const c=COV[wi].c;if($('bword').dataset.i!=wi){$('bword').dataset.i=wi;$('bword').innerHTML=`${c.word} <span class="m">${R.text.mcq_word}</span>`;$('bword').style.fontSize=c.fs+'px'}
  $('bword').style.transform=`scale(${lerp(PUNCH,1,EASE.out5(seg(t,c.t,c.t+.12)))})`}
 $('stage').style.transform=shake?`translate(${Math.sin(t*90)*12*shake}px,${Math.cos(t*77)*12*shake}px)`:'none';
 // phone pose

 $('glow').style.opacity=pv*.9;$('glow').style.transform=`translate(${P.x-540}px,${(P.y-1130)*.6}px) scale(${.7+.3*P.s/1.3})`;

 // screens: [{name,t0,t1,in:{type,dur}}], scroll tracks per segment
 let lessonMs=null;
 const vis=[];
 R.segments.forEach((sg,i)=>{if(t<sg.t0-0.001||t>sg.t1+(sg.out||0))return;vis.push([sg,i])});
 // hidden screens keep their layout (visibility, not display): the lesson card measures its text while loading
 for(const s of Object.values(SC))s.el.style.visibility='hidden';
 vis.forEach(([sg,i])=>{const S=SC[sg.screen],el=S.el;el.style.visibility='visible';
  const sc=track(sg.scroll,t).y;S.doc.style.transform=`translateY(${-sc}px)`;
  const fn=clamp(sc/14,0,1);S.f0.style.opacity=1-fn;S.fN.style.opacity=fn;
  // enter transition
  let tx=0,op=1,fil='none',z=i;const p=sg.in?seg(t,sg.t0,sg.t0+sg.in.dur):1;
  if(sg.in&&p<1){if(sg.in.type==='push'){tx=390*(1-EASE.out(p))}else if(sg.in.type==='fade'){op=EASE.io(p)}
   else if(sg.in.type==='whip'){tx=390*(1-EASE.io(p));fil=`blur(${Math.sin(Math.PI*p)*10}px)`}}
  // a following segment pushing in moves this one away a little
  const nx=R.segments[i+1];if(nx&&nx.in&&t>=nx.t0){const q=seg(t,nx.t0,nx.t0+nx.in.dur);
   if(nx.in.type==='push')tx-=110*EASE.out(q);if(nx.in.type==='whip'){tx-=390*EASE.io(q);fil=`blur(${Math.sin(Math.PI*q)*10}px)`}}
  el.style.transform=`translateX(${tx}px)`;el.style.opacity=op;el.style.filter=fil;el.style.zIndex=z;
  S.hls.forEach(({el:h,h:hh})=>{h.style.opacity=hh.t0!=null?Math.min(seg(t,hh.t0,hh.t0+.3),1-seg(t,hh.t1-.3,hh.t1)):0});
  if(S.pulse){const q=((t-(sg.pulse0||0))%1.2)/1.2;S.pulse.style.opacity=(t>=sg.pulse0&&t<sg.pulse1)?(1-q):0;S.pulse.style.transform=`scale(${1+1.1*EASE.out(q)})`}
  if(R.lesson&&sg.screen===R.lesson.screen){const L=R.lesson,ms=Math.round(clamp((t-L.t0)*L.rate*1000,0,L.duration_ms));lessonMs=ms;
   const fmt=v=>(v/1000).toFixed(1);S.time.textContent=`${fmt(ms)} / ${fmt(L.duration_ms)} s`;
   const f=ms/L.duration_ms;S.range.querySelector('.fi').style.width=(f*100)+'%';S.range.querySelector('.th').style.left=(f*100)+'%'}});
 // finger + taps (screen coords)
 const F=track(R.finger,t);$('tap').style.left=F.x+'px';$('tap').style.top=F.y+'px';
 let press=0;for(const k of R.taps)if(t>=k&&t<k+.22)press=1-(t-k)/.22;
 $('tap').style.opacity=F.o;$('tap').style.transform=`scale(${1-.2*press})`;
 let rp=-1;for(const k of R.taps)if(t>=k&&t<k+.5)rp=(t-k)/.5;
 $('ripple').style.left=F.x+'px';$('ripple').style.top=F.y+'px';$('ripple').style.opacity=rp<0?0:(1-rp)*Math.max(F.o,.6);$('ripple').style.transform=`scale(${1+1.8*EASE.out(Math.max(rp,0))})`;
 // kinetic texts
 TX.forEach(({x,box,words})=>{const on=t>=x.t0-.01&&t<=x.t1;box.style.display=on?'block':'none';if(!on)return;
  const out=seg(t,x.t1-.32,x.t1);
  words.forEach(({el,i})=>{const a=x.t0+i*(x.stagger??.07),p=seg(t,a,a+.38);
   el.style.opacity=p*(1-out);el.style.transform=`translateY(${(1-EASE.out5(p))*46-out*40}px) scale(${lerp(.92,1,EASE.back(p))})`;el.style.filter=p<1?`blur(${(1-p)*8}px)`:'none'})});
 const scr=R.scrim.reduce((m,k)=>Math.max(m,Math.min(seg(t,k[0],k[0]+.35),1-seg(t,k[1]-.35,k[1]))),0);$('scrim').style.opacity=scr;
 // brand
 const bv=Math.min(seg(t,T.brand[0],T.brand[0]+.4),1-seg(t,T.brand[1]-.3,T.brand[1]));$('brand').style.opacity=bv;
 // end card
 const ev=seg(t,T.end[0],T.end[0]+.4);$('end').style.opacity=ev;
 $('endlogo').style.transform=`scale(${lerp(.82,1,EASE.back(seg(t,T.end[0]+.05,T.end[0]+.6)))})`;
 $('endiq').style.opacity=seg(t,T.end[0]+.3,T.end[0]+.6);$('endtag').style.opacity=seg(t,T.end[0]+.45,T.end[0]+.8);$('endtagar').style.opacity=seg(t,T.end[0]+.6,T.end[0]+.95);
 $('endcta').style.opacity=seg(t,T.end[0]+.7,T.end[0]+1.1);
 minis.forEach(({ph,m},k)=>{const p=EASE.out5(seg(t,T.end[0]+.15+.12*k,T.end[0]+.95+.12*k)),dr=Math.sin((t-T.end[0])*1.1+k)*8;
  ph.style.opacity=p;ph.style.transform=`translate3d(${m.x-209}px,${m.y-470+(1-p)*260+dr}px,0) rotateY(${m.ry}deg) rotateZ(${m.rz}deg) scale(${m.s})`});
 // wipe flashes

 return lessonMs};
const pre=[...document.images].map(i=>i.decode().catch(()=>0)).concat((R.covers||[]).map(c=>{const i=new Image();i.src=c.file;return i.decode().catch(()=>0)}));
// the first frame (which hides the card's screen) waits for the card, or for 20 s (then Python reports the failure)
const lessonWait=Promise.race([lessonLoaded,new Promise(r=>setTimeout(r,20000))]);
window.ready=Promise.all([document.fonts.ready,flagLoad,...pre,lessonWait]).then(()=>{const overflow=[];
 const texts=TX.map(({x,box})=>{box.style.display='block';const r=box.getBoundingClientRect();
  box.querySelectorAll('.w').forEach(w=>{const b=w.getBoundingClientRect();if(b.left<40||b.right>1040)overflow.push(x.id+':'+w.textContent)});

  const g=document.createRange();g.selectNodeContents(b);c.fs=Math.min(128,Math.floor(100*980/(g.getBoundingClientRect().width*PUNCH)))});

  if(rs.some(b=>b.left<40||b.right>1040)||ys.size>n)overflow.push('end:'+el.textContent.replace(/\s+/g,' ').trim())};
 lines($('endiqt'),1);lines($('endtag'),2);lines($('endtagar'),1);lines($('endfree'),1);lines($('endfreeen'),1);lines($('endsend'),1);
