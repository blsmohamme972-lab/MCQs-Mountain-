name: Deploy Kafu Content

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "content-worker/**"
      - ".github/workflows/deploy-content.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy content worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "7c59c4350999f209f3e868470908b9a4"
          wranglerVersion: "4"
          command: deploy --config content-worker/wrangler.jsonc
