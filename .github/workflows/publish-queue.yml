name: Drain Kafu Publish Queue

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/kafu-bot-command.trigger"

permissions:
  contents: write
  actions: read

concurrency:
  group: kafu-content-publisher
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      QUEUE_API_TOKEN: ${{ secrets.QUEUE_API_TOKEN }}
      QUEUE_API_URL: https://kafu.blsmohamme97.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Send one-time bot command
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.http_client import request_bytes

          command = Path(".github/kafu-bot-command.trigger").read_text().strip()
          allowed = {"/retry KAFU-UPLOAD-TEST_v1", "/queue", "/books"}
          if command not in allowed:
              raise SystemExit("Unexpected bot command marker")
          owner = int(os.environ["OWNER_TELEGRAM_ID"])
          request_bytes(
              "https://kafu.blsmohamme97.workers.dev/bot",
              step="bot.command",
              method="POST",
              data=__import__("json").dumps({
                  "message": {
                      "from": {"id": owner},
                      "chat": {"id": owner, "type": "private"},
                      "text": command,
                  }
              }).encode(),
              headers={
                  "Content-Type": "application/json",
                  "X-Telegram-Bot-Api-Secret-Token": os.environ["WEBHOOK_SECRET"],
              },
          )
          PY
      - name: Install image decoder
        if: github.event_name != 'push'
        run: python -m pip install 'Pillow>=11,<13'
      - name: Drain all ready jobs in order
        if: github.event_name != 'push'
        run: python tools/drain_queue.py
