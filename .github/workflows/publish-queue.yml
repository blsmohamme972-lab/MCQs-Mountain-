name: Drain Kafu Publish Queue

on:
  workflow_dispatch:
  schedule:
    # Uploads dispatch immediately; recover missed dispatches once daily.
    - cron: "0 3 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: kafu-content-publisher
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
      QUEUE_API_TOKEN: ${{ secrets.QUEUE_API_TOKEN }}
      QUEUE_API_URL: https://kafu.blsmohamme97.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install image decoder
        run: python -m pip install 'Pillow>=11,<13'
      - name: Drain all ready jobs in order
        run: python tools/drain_queue.py
