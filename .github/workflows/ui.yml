name: Kafu Visual and Flow CI

on:
  pull_request:
    paths:
      - 'app/**'
  push:
    branches: [main]
    paths:
      - 'app/**'

permissions:
  contents: read

concurrency:
  group: kafu-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare baseline source evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p evidence/transport
          git archive --format=zip --output=evidence/transport/source.zip HEAD
          git archive --format=zip --output=evidence/transport/base.zip "$BASE_SHA"
      - name: Upload initial evidence
        uses: actions/upload-artifact@v4
        with:
          name: kafu-ui-bootstrap
          path: evidence/
          retention-days: 3
          if-no-files-found: error
