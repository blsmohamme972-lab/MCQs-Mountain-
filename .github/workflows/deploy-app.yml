name: Deploy Kafu

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "worker/**"
      - "migrations/**"
      - "tools/configure_d1.py"
      - "wrangler.app.jsonc"
      - ".github/workflows/deploy-app.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Configure D1 binding
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: python tools/configure_d1.py
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply kafu-db --remote --config wrangler.app.jsonc
      - name: Upload Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          QUEUE_API_TOKEN: ${{ secrets.QUEUE_API_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          jq -n             --arg BOT_TOKEN "$BOT_TOKEN"             --arg OWNER_TELEGRAM_ID "$OWNER_TELEGRAM_ID"             --arg WEBHOOK_SECRET "$WEBHOOK_SECRET"             --arg QUEUE_API_TOKEN "$QUEUE_API_TOKEN"             --arg DISPATCH_TOKEN "$DISPATCH_TOKEN"             '{BOT_TOKEN:$BOT_TOKEN,OWNER_TELEGRAM_ID:$OWNER_TELEGRAM_ID,WEBHOOK_SECRET:$WEBHOOK_SECRET,QUEUE_API_TOKEN:$QUEUE_API_TOKEN,DISPATCH_TOKEN:$DISPATCH_TOKEN}'             > /tmp/kafu-secrets.json
          npx wrangler secret bulk /tmp/kafu-secrets.json --config wrangler.app.jsonc
          rm -f /tmp/kafu-secrets.json
      - name: Deploy Kafu to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.app.jsonc
