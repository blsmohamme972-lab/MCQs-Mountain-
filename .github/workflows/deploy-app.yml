name: Deploy Kafu

on:
  workflow_dispatch:
    inputs:
      motioncards_rollout_authorized:
        description: "Explicit owner authorization for the first MotionCards production rollout"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "worker/**"
      - "migrations/**"
      - "tools/configure_d1.py"
      - "tools/smoke_live.py"
      - "wrangler.app.jsonc"
      - ".github/workflows/deploy-app.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Gate MotionCards first production rollout
        env:
          MOTIONCARDS_ROLLOUT_ENABLED: ${{ vars.MOTIONCARDS_ROLLOUT_ENABLED || 'false' }}
          MOTIONCARDS_ROLLOUT_AUTHORIZED: ${{ inputs.motioncards_rollout_authorized || 'false' }}
        run: |
          set -euo pipefail
          if [[ -f migrations/0006_motioncards_queue.sql && "$MOTIONCARDS_ROLLOUT_ENABLED" != "true" && "$MOTIONCARDS_ROLLOUT_AUTHORIZED" != "true" ]]; then
            echo "::error::MotionCards production rollout is gated. Obtain explicit owner rollout authorization, then use workflow_dispatch with motioncards_rollout_authorized=true. Do not treat a merge as production-neutral."
            exit 1
          fi
      - name: Fetch hash-pinned frontend dependencies
        run: python tools/vendor_frontend.py
      - name: Assemble tested frontend modules
        run: python tools/build_frontend.py --in-place
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Configure D1 binding
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: python tools/configure_d1.py
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply kafu-db --remote --config wrangler.app.jsonc
      - name: Upload Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          # Telegram numeric user IDs are identifiers, not credentials. Pin the sole owner
          # here so a missing/stale repository secret cannot silently hide owner-only UI.
          OWNER_TELEGRAM_ID: "8634102362"
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          QUEUE_API_TOKEN: ${{ secrets.QUEUE_API_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS || '8634102362' }}
          D1_ANALYTICS_TOKEN: ${{ secrets.D1_ANALYTICS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$OWNER_TELEGRAM_ID" =~ ^[0-9]+$ ]] || { echo "OWNER_TELEGRAM_ID must be numeric"; exit 1; }
          [[ "$OWNER_TELEGRAM_ID" == "8634102362" ]] || { echo "OWNER_TELEGRAM_ID is not the configured owner"; exit 1; }
          jq -n \
            --arg BOT_TOKEN "$BOT_TOKEN" \
            --arg OWNER_TELEGRAM_ID "$OWNER_TELEGRAM_ID" \
            --arg WEBHOOK_SECRET "$WEBHOOK_SECRET" \
            --arg QUEUE_API_TOKEN "$QUEUE_API_TOKEN" \
            --arg DISPATCH_TOKEN "$DISPATCH_TOKEN" \
            --arg ADMIN_IDS "$ADMIN_IDS" \
            --arg D1_ANALYTICS_TOKEN "$D1_ANALYTICS_TOKEN" \
            --arg CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID" \
            '{BOT_TOKEN:$BOT_TOKEN,OWNER_TELEGRAM_ID:$OWNER_TELEGRAM_ID,WEBHOOK_SECRET:$WEBHOOK_SECRET,QUEUE_API_TOKEN:$QUEUE_API_TOKEN,DISPATCH_TOKEN:$DISPATCH_TOKEN,ADMIN_IDS:$ADMIN_IDS,D1_ANALYTICS_TOKEN:$D1_ANALYTICS_TOKEN,CLOUDFLARE_ACCOUNT_ID:$CLOUDFLARE_ACCOUNT_ID}' \
            > /tmp/kafu-secrets.json
          npx wrangler secret bulk /tmp/kafu-secrets.json --config wrangler.app.jsonc
          rm -f /tmp/kafu-secrets.json
      - name: Upload staged Worker version
        id: staged
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TAG="design1-${GITHUB_SHA:0:12}-${GITHUB_RUN_ATTEMPT}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          npx wrangler versions upload --tag "$TAG" --message "staged ${GITHUB_SHA}" --config wrangler.app.jsonc | tee /tmp/kafu-version-upload.log
          VERSION_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev/?' /tmp/kafu-version-upload.log | tail -1)"
          test -n "$VERSION_URL"
          echo "version_url=$VERSION_URL" >> "$GITHUB_OUTPUT"
      - name: Smoke exact staged Version URL
        run: python tools/smoke_live.py --app-url "${{ steps.staged.outputs.version_url }}" --required-book KAFU-UPLOAD-TEST --export-book ANATOMY-MRCS-WOOD-BLACKBURN --export-version 2 --export-questions 209
      - name: Promote staged version to 100%
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler versions deploy --version-tag "${{ steps.staged.outputs.tag }}@100%" --yes --config wrangler.app.jsonc
      - name: Verify production after promotion
        run: python tools/smoke_live.py --required-book KAFU-UPLOAD-TEST --export-book ANATOMY-MRCS-WOOD-BLACKBURN --export-version 2 --export-questions 209
      - name: Install pinned browser for exact production UI verification
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Verify exact production UI SHA after promotion
        run: python tools/ui/production_smoke.py --commit "$GITHUB_SHA"

