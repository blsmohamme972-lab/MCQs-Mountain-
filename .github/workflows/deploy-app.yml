name: Deploy Kafu

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "worker/**"
      - "migrations/**"
      - "tools/configure_d1.py"
      - "wrangler.app.jsonc"
      - ".github/workflows/deploy-app.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Configure D1 binding
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: python tools/configure_d1.py
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "7c59c4350999f209f3e868470908b9a4"
        run: npx wrangler d1 migrations apply kafu-db --remote --config wrangler.app.jsonc
      - name: Deploy Kafu to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "7c59c4350999f209f3e868470908b9a4"
          wranglerVersion: "4"
          command: deploy --config wrangler.app.jsonc
          secrets: |
            BOT_TOKEN
            OWNER_TELEGRAM_ID
            WEBHOOK_SECRET
            QUEUE_API_TOKEN
            GITHUB_DISPATCH_TOKEN
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          QUEUE_API_TOKEN: ${{ secrets.QUEUE_API_TOKEN }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
