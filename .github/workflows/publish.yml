name: Publish Kafu Book

on:
  workflow_dispatch:
    inputs:
      package_url:
        description: "Direct HTTPS URL to one validated BOOK_ID_vN.zip"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: kafu-content-publisher
  cancel-in-progress: false

env:
  CONTENT_BASE_URL: https://kafu-content-1.blsmohamme97.workers.dev
  CLOUDFLARE_ACCOUNT_ID: "7c59c4350999f209f3e868470908b9a4"
  GH_TOKEN: ${{ github.token }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download package
        env:
          PACKAGE_URL: ${{ inputs.package_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$PACKAGE_URL" -o incoming.zip
          test -s incoming.zip
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("incoming.zip") as z:
              print("ZIP entries:", len(z.infolist()))
          PY

      - name: Validate package
        run: |
          set -euo pipefail
          python tools/validate.py --require-audit incoming.zip
          python tools/validate_release.py incoming.zip

      - name: Read package identity
        id: pkg
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, zipfile
          with zipfile.ZipFile("incoming.zip") as z:
              b=json.loads(z.read("book.json"))
          print(f"book_id={b['book_id']}")
          print(f"version={b['version']}")
          PY

      - name: Restore active build state
        run: |
          set -euo pipefail
          mkdir -p state build
          if gh release view kafu-content-state >/dev/null 2>&1; then
            gh release download kafu-content-state --pattern "content.sqlite" --pattern "site-bundle.tar.gz" --dir state
          fi
          if [ -f state/site-bundle.tar.gz ]; then
            tar -xzf state/site-bundle.tar.gz -C build
          else
            mkdir -p build/content
            cp -a content-worker/dist/content/. build/content/
          fi
          test -f build/content/config.json
          test -f build/content/catalog.json

      - name: Reject exact duplicate package
        id: duplicate
        run: |
          set -euo pipefail
          HASH="$(sha256sum incoming.zip | awk '{print $1}')"
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
          if [ -f state/content.sqlite ]; then
            FOUND="$(python - "$HASH" <<'PY'
          import sqlite3,sys
          db="state/content.sqlite"
          h=sys.argv[1]
          try:
              con=sqlite3.connect(db)
              row=con.execute("select 1 from published_packages where sha256=?", (h,)).fetchone()
              print("yes" if row else "no")
          except sqlite3.Error:
              print("no")
          PY
          )"
          else
            FOUND=no
          fi
          echo "found=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Stop duplicate safely
        if: steps.duplicate.outputs.found == 'yes'
        run: |
          echo "This exact ZIP was already published. Nothing changed."

      - name: Build candidate content
        if: steps.duplicate.outputs.found != 'yes'
        run: |
          set -euo pipefail
          python tools/publish.py             --db state/content.sqlite             --out build/content             --base-url "$CONTENT_BASE_URL"             incoming.zip
          python - "${{ steps.duplicate.outputs.sha256 }}" "${{ steps.pkg.outputs.book_id }}" "${{ steps.pkg.outputs.version }}" <<'PY'
          import sqlite3,sys
          db="state/content.sqlite"
          h,book_id,version=sys.argv[1],sys.argv[2],int(sys.argv[3])
          con=sqlite3.connect(db)
          con.execute(
              "insert or ignore into published_packages(sha256,book_id,version) values(?,?,?)",
              (h,book_id,version),
          )
          con.commit()
          PY
          rm -rf content-worker/dist/content
          mkdir -p content-worker/dist/content
          cp -a build/content/. content-worker/dist/content/
          tar -C build -czf state/site-bundle.tar.gz content

      - name: Save immutable candidate state
        if: steps.duplicate.outputs.found != 'yes'
        env:
          CANDIDATE_TAG: state-${{ github.run_id }}
        run: |
          set -euo pipefail
          gh release create "$CANDIDATE_TAG"             state/content.sqlite state/site-bundle.tar.gz             --title "Kafu candidate state ${{ github.run_id }}"             --notes "Candidate for ${{ steps.pkg.outputs.book_id }} v${{ steps.pkg.outputs.version }}. Created before Cloudflare promotion."

      - name: Upload inactive Cloudflare version
        if: steps.duplicate.outputs.found != 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION_TAG: publish-${{ github.run_id }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 versions upload             --config content-worker/wrangler.jsonc             --tag "$VERSION_TAG"             --preview-alias candidate             --message "Book ${{ steps.pkg.outputs.book_id }} v${{ steps.pkg.outputs.version }}"

      - name: Smoke-test candidate Version URL
        if: steps.duplicate.outputs.found != 'yes'
        env:
          BOOK_ID: ${{ steps.pkg.outputs.book_id }}
        run: |
          set -euo pipefail
          BASE="https://candidate-kafu-content-1.blsmohamme97.workers.dev"
          curl --fail --retry 5 --retry-delay 2 "$BASE/config.json" -o /tmp/config.json
          curl --fail --retry 5 --retry-delay 2 "$BASE/catalog.json" -o /tmp/catalog.json
          python - "$BOOK_ID" <<'PY'
          import json,sys
          book_id=sys.argv[1]
          json.load(open("/tmp/config.json"))
          catalog=json.load(open("/tmp/catalog.json"))
          books={b.get("id") for b in catalog.get("books",[])}
          if book_id not in books:
              raise SystemExit(f"{book_id} missing from candidate catalog")
          print("Candidate catalog contains", book_id)
          PY

      - name: Promote tested version
        if: steps.duplicate.outputs.found != 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION_TAG: publish-${{ github.run_id }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 versions deploy             --config content-worker/wrangler.jsonc             --version-tag "$VERSION_TAG"             --percentage 100             --message "Publish ${{ steps.pkg.outputs.book_id }} v${{ steps.pkg.outputs.version }}"

      - name: Verify production
        if: steps.duplicate.outputs.found != 'yes'
        env:
          BOOK_ID: ${{ steps.pkg.outputs.book_id }}
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-delay 2 "$CONTENT_BASE_URL/catalog.json" -o /tmp/live-catalog.json
          python - "$BOOK_ID" <<'PY'
          import json,sys
          book_id=sys.argv[1]
          catalog=json.load(open("/tmp/live-catalog.json"))
          if book_id not in {b.get("id") for b in catalog.get("books",[])}:
              raise SystemExit(f"{book_id} missing from live catalog")
          print("Production catalog contains", book_id)
          PY

      - name: Update active durable state
        if: steps.duplicate.outputs.found != 'yes'
        run: |
          set -euo pipefail
          if gh release view kafu-content-state >/dev/null 2>&1; then
            gh release upload kafu-content-state state/content.sqlite state/site-bundle.tar.gz --clobber
          else
            gh release create kafu-content-state               state/content.sqlite state/site-bundle.tar.gz               --title "Kafu active content state"               --notes "Current master content database and complete generated content tree."
          fi

      - name: Summary
        run: |
          {
            echo "## Kafu publish"
            echo ""
            echo "- Book: ${{ steps.pkg.outputs.book_id }}"
            echo "- Version: ${{ steps.pkg.outputs.version }}"
            echo "- Package SHA-256: ${{ steps.duplicate.outputs.sha256 }}"
            echo "- Duplicate: ${{ steps.duplicate.outputs.found }}"
            echo "- Content URL: $CONTENT_BASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
