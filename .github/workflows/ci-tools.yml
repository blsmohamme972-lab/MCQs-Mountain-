name: Kafu Content Contract CI

on:
  push:
    branches:
      - main
      - m3-bot-upload-queue
    paths:
      - "app/**"
      - "content-worker/**"
      - "tools/**"
      - "worker/**"
      - "migrations/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "app/**"
      - "content-worker/**"
      - "tools/**"
      - "worker/**"
      - "migrations/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Fetch hash-pinned frontend dependencies
        run: python tools/vendor_frontend.py
      - name: Install image decoder
        run: python -m pip install 'Pillow>=11,<13'
      - name: Compile publishing tools
        run: python -m py_compile tools/validate.py tools/validate_release.py tools/audit.py tools/publish.py tools/package_state.py tools/content_admin.py tools/fixtures/generate_fixtures.py tools/verify_catalog.py tools/http_client.py tools/drain_queue.py tools/queue_admin.py tools/configure_d1.py tools/setup_bot.py tools/build_frontend.py tools/vendor_frontend.py
      - name: Run publishing and queue tests
        run: python -m unittest discover -s tools/tests -p "test_*.py" -v
      - name: Check Worker and Mini App JavaScript syntax and tests
        run: |
          node --check worker/bot.mjs
          node --test worker/bot.test.mjs
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("app/index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, flags=re.I)
          inline=[s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit("No inline app script found")
          Path("/tmp/kafu-app.js").write_text(inline[-1], encoding="utf-8")
          PY
          node --check /tmp/kafu-app.js
      - name: Validate static content JSON
        run: |
          python -m json.tool content-worker/dist/content/catalog.json >/dev/null
          python -m json.tool content-worker/dist/content/config.json >/dev/null
