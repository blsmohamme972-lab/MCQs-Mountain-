name: Kafu Content Contract CI

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "content-worker/**"
      - "tools/**"
      - "worker/**"
      - "migrations/**"
      - "Animations and illustrations/**"
      - "motioncards/**"
      - "motioncards-worker/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "app/**"
      - "content-worker/**"
      - "tools/**"
      - "worker/**"
      - "migrations/**"
      - ".github/workflows/**"
      - "Animations and illustrations/**"
      - "motioncards/**"
      - "motioncards-worker/**"

# Paths keep documentation-only pull requests and main commits from starting CI.
# One run per pull request (or main) prevents outdated work from consuming minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Fetch hash-pinned frontend dependencies
        run: python tools/vendor_frontend.py
      - name: Install content tooling
        run: python -m pip install 'Pillow>=11,<13' 'PyMuPDF>=1.24,<2'
      - name: Compile publishing tools
        run: python -m py_compile tools/validate.py tools/validate_release.py tools/audit.py tools/publish.py tools/package_state.py tools/content_admin.py tools/fixtures/generate_fixtures.py tools/verify_catalog.py tools/http_client.py tools/drain_queue.py tools/queue_admin.py tools/configure_d1.py tools/setup_bot.py tools/build_frontend.py tools/vendor_frontend.py tools/package_batch.py tools/parsers/__init__.py tools/parsers/simple_numbered_mcq.py
      - name: Run publishing and queue tests
        run: python -m unittest discover -s tools/tests -p "test_*.py" -v
      - name: Check Worker and Mini App JavaScript syntax and tests
        run: |
          node --check worker/admin.mjs
          node --check worker/mcq-export.mjs
          node --check worker/motioncards-queue.mjs
          node --check motioncards-worker/worker.mjs
          node --test motioncards-worker/worker.test.mjs
          node --check worker/leaderboard.mjs
          node --check worker/bot.mjs
          node --test worker/bot.test.mjs
          node --test worker/mcq-export.test.mjs
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("app/index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, flags=re.I)
          inline=[s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit("No inline app script found")
          Path("/tmp/kafu-app.js").write_text(inline[-1], encoding="utf-8")
          PY
          node --check /tmp/kafu-app.js
      - name: Verify Cloudflare content service binding against live published book
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 dev --remote --config tools/cloudflare/wrangler.content-binding-smoke.jsonc --port 8789 > /tmp/kafu-binding-smoke.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:8789/ -o /tmp/kafu-binding-smoke.json; then break; fi
            sleep 2
          done
          test -s /tmp/kafu-binding-smoke.json || { cat /tmp/kafu-binding-smoke.log; exit 1; }
          python - <<'PY'
          import json
          d=json.load(open("/tmp/kafu-binding-smoke.json"))
          assert d.get("ok") is True, d
          assert d["book_id"]=="ANATOMY-MRCS-WOOD-BLACKBURN", d
          assert d["version"]==2 and d["questions"]==209 and d["chapters"]>0, d
          assert d["catalog_status"]==200 and "json" in d["catalog_content_type"].lower(), d
          print("remote content service binding: PASS", d)
          PY
      - name: Measure D1 reads and exercise MotionCards D1 concurrency with local workerd
        run: |
          npm install --no-save --package-lock=false miniflare@4.20260730.0
          node tools/tests/d1-read-bounds.mjs
          node tools/tests/motioncards-d1-runtime.mjs
      - name: Verify real D1 analytics access without logging private metrics
        env:
          D1_ANALYTICS_TOKEN: ${{ secrets.D1_ANALYTICS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: node tools/check_d1_analytics.mjs
      - name: Validate static content JSON
        run: |
          python -m json.tool content-worker/dist/content/catalog.json >/dev/null
          python -m json.tool content-worker/dist/content/config.json >/dev/null

      - name: Build synthetic MotionCards example and offline authoring kit
        run: |
          rm -rf /tmp/kafu-motioncards-ci
          mkdir -p /tmp/kafu-motioncards-ci
          python tools/motioncards_example.py --out /tmp/kafu-motioncards-ci/example
          python tools/motioncards_bundle.py --out /tmp/kafu-motioncards-ci/kafu-motioncards-authoring-kit.zip
          python tools/motioncards.py validate /tmp/kafu-motioncards-ci/example/MCARDS_FIXTURE-DEMO_r1.zip
      - name: Keep MotionCards authoring artifacts
        # The kit was already built and validated above; storage quota must not fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kafu-motioncards-authoring-example
          path: /tmp/kafu-motioncards-ci/
          retention-days: 7
          if-no-files-found: error


  motioncards_engine:
    name: MotionCards engine browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned browser test dependencies
        run: python -m pip install "playwright==1.57.0" "Pillow>=11,<13"
      - name: Install pinned Chromium
        run: python -m playwright install --with-deps chromium
      - name: Render every engine feature through the sandboxed host protocol
        env:
          MOTIONCARDS_BROWSER_TESTS: "1"
        run: python -m unittest tools.tests.test_motioncards_engine_v2 -v

  medical_illustrations:
    name: Medical illustration library
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Animations and illustrations
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned browser smoke dependency
        run: python -m pip install "playwright==1.57.0"
      - name: Install pinned Chromium
        run: python -m playwright install --with-deps chromium
      - name: Build and verify the offline library
        run: |
          node scripts/build.mjs
          node scripts/build.mjs --check
          node tests/parts_verify.mjs
          node tests/verify.mjs
          node tests/library_verify.mjs
          node tests/layout_verify.mjs
          node tests/visual_regression.mjs
      - name: Run browser smoke checks
        run: python tests/browser_smoke.py
