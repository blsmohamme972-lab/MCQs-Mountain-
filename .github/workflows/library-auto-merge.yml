name: MotionCards library auto-merge

# A library proposal is a PR from a branch named library/... opened by the repository owner.
# It merges automatically only when the library gate passes (purely additive, licence-safe, renders,
# not a duplicate, existing entries and recipes untouched) AND the MotionCards test suite passes.
# Anything the gate cannot prove is left open for a human.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: library-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  gate:
    if: >-
      startsWith(github.head_ref, 'library/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned browser test dependencies
        run: python -m pip install "playwright==1.57.0" "Pillow>=11,<13"
      - name: Install pinned Chromium
        run: python -m playwright install --with-deps chromium
      - name: Library gate
        id: gate
        continue-on-error: true
        run: python tools/motioncards.py library-check --base origin/main --report /tmp/library-gate.md
      - name: MotionCards tests (unit + browser)
        id: tests
        if: steps.gate.outcome == 'success'
        env:
          MOTIONCARDS_BROWSER_TESTS: "1"
        run: python -m unittest $(ls tools/tests/test_motioncards*.py | sed 's|/|.|g;s|\.py$||')
      - name: Report on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat /tmp/library-gate.md 2>/dev/null || echo "## MotionCards library gate: FAIL (no report)"
            echo
            echo "MotionCards tests: ${{ steps.tests.outcome }}"
            echo
            echo "---"
            echo "_Generated by the MotionCards library gate workflow_"
          } > /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file /tmp/comment.md
      - name: Merge when everything passed
        if: steps.gate.outcome == 'success' && steps.tests.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --merge --match-head-commit ${{ github.event.pull_request.head.sha }}
      - name: Fail the check when the proposal was not merged
        if: steps.gate.outcome != 'success' || steps.tests.outcome != 'success'
        run: exit 1
