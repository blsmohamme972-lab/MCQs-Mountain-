<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedMCQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #F1F5F5;
  --surface: #FFFFFF;
  --surface-2: #E4EDED;
  --ink: #102A2E;
  --muted: #5A6F73;
  --line: #D2DEDE;
  --teal: #0F4C54;
  --teal-2: #16606A;
  --teal-soft: #DCEBEC;
  --crimson: #A8323E;
  --crimson-soft: #F6E3E5;
  --green: #2C7650;
  --green-soft: #E0F0E7;
  --btn: #16606A;
  --on-btn: #FFFFFF;
  --fs: 1;
  --ui: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --read: "Lora", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1F22; --surface: #122A2E; --surface-2: #1A363A; --ink: #E6EFEF;
    --muted: #93A8AB; --line: #25444A; --teal: #6FB9C2; --teal-2: #3E929C;
    --teal-soft: #173A3F; --crimson: #E58891; --crimson-soft: #3A1E22;
    --green: #6CC596; --green-soft: #173427; --btn: #1D6E78; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1F22; --surface: #122A2E; --surface-2: #1A363A; --ink: #E6EFEF;
  --muted: #93A8AB; --line: #25444A; --teal: #6FB9C2; --teal-2: #3E929C;
  --teal-soft: #173A3F; --crimson: #E58891; --crimson-soft: #3A1E22;
  --green: #6CC596; --green-soft: #173427; --btn: #1D6E78; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.5 var(--ui); -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--teal-2); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 640px; margin: 0 auto; padding: 8px 16px 120px; }
.has-action .wrap { padding-bottom: 140px; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid transparent;
}
.top.scrolled { border-bottom-color: var(--line); }
.top-in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 12px; min-height: 52px; }
.top h1 { font-size: 17px; font-weight: 600; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--ink); flex: none; }
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }
.tg .back-btn { display: none; }

/* Home */
.hello { padding: 14px 0 18px; }
.hello h2 { font-family: var(--read); font-weight: 500; font-size: 30px; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.01em; }
.hello p { margin: 0; color: var(--muted); }
.resume {
  display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center;
  background: var(--teal); color: #fff; border-radius: 20px; padding: 16px; width: 100%; text-align: left;
}
.resume .spine { height: 76px; border-radius: 6px 10px 10px 6px; box-shadow: inset 5px 0 0 rgba(0,0,0,.2), 0 0 0 1.5px rgba(255,255,255,.55); }
.resume small { display: block; opacity: .8; font-size: 12.5px; }
.resume strong { display: block; font-size: 16px; font-weight: 600; line-height: 1.3; margin: 2px 0 8px; }
.resume .go { display: inline-block; background: #fff; color: var(--teal); font-weight: 600; font-size: 13.5px; padding: 6px 14px; border-radius: 999px; }
.empty-start { background: var(--surface); border: 1px dashed var(--line); border-radius: 20px; padding: 20px; }
.empty-start p { margin: 0 0 12px; color: var(--muted); }

h3.sec { font-size: 15px; font-weight: 600; margin: 28px 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
h3.sec button { font-size: 13.5px; font-weight: 500; color: var(--teal-2); }

.list { background: var(--surface); border-radius: 16px; overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 14px 16px; border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row:active { background: var(--surface-2); }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 500; }
.row .s { color: var(--muted); font-size: 13px; }
.row .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.row .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal-2); flex: none; }
.row .ic svg { width: 19px; height: 19px; }
.row .ic.red { background: var(--crimson-soft); color: var(--crimson); }
.chev { color: var(--muted); width: 18px; height: 18px; flex: none; }

/* Book covers */
.shelf { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
.shelf::-webkit-scrollbar { display: none; }
.cover {
  position: relative; aspect-ratio: 3 / 4.2; border-radius: 6px 12px 12px 6px; color: #fff;
  padding: 12px 8px 10px 14px; display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: inset 6px 0 0 rgba(0,0,0,.2); overflow: hidden;
}
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.14), transparent 45%); pointer-events: none; }
.cover { container-type: inline-size; }
.cover .ct { font-family: var(--read); font-weight: 600; font-size: clamp(10.5px, 12.5cqi, 17px); line-height: 1.2; -webkit-hyphens: auto; hyphens: auto; overflow-wrap: break-word; }
.cover .ca { font-size: 10.5px; opacity: .85; }
.shelf .cover { width: 104px; flex: none; }
.books { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px 14px; }
.book-card { text-align: left; display: flex; flex-direction: column; gap: 8px; }
.book-card .bt { font-weight: 500; font-size: 14px; line-height: 1.3; }
.book-card .bs { color: var(--muted); font-size: 12.5px; }
.pbar { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--teal-2); border-radius: 4px; }

/* Specialties */
.specs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.spec { background: var(--surface); border-radius: 16px; padding: 16px 14px; text-align: left; min-height: 92px; display: flex; flex-direction: column; justify-content: space-between; border-left: 4px solid var(--c, var(--teal-2)); }
.spec .t { font-weight: 600; line-height: 1.25; }
.spec .s { color: var(--muted); font-size: 12.5px; }

/* Book page */
.book-head { display: grid; grid-template-columns: 112px 1fr; gap: 16px; padding: 10px 0 18px; }
.book-head h2 { font-family: var(--read); font-weight: 600; font-size: 22px; line-height: 1.2; margin: 0 0 6px; }
.book-head .meta { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13.5px; font-weight: 500; }
.pill.on { color: var(--crimson); border-color: var(--crimson); }
.pill svg { width: 16px; height: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--btn); color: var(--on-btn); font-weight: 600; padding: 12px 18px; border-radius: 14px; }
.btn.small { padding: 8px 14px; font-size: 13.5px; border-radius: 10px; }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn[disabled] { opacity: .45; }
.ch-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.ch-row:last-child { border-bottom: 0; }
.ch-row .grow { flex: 1; min-width: 0; }
.ch-no { width: 28px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.spin { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--teal-2); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Study */
.study-top { display: flex; align-items: center; gap: 10px; padding: 4px 0 14px; color: var(--muted); font-size: 13px; }
.study-top .pbar { flex: 1; }
.timer { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
.timer.low { color: var(--crimson); }
.qmeta { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.tag { font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: var(--teal-soft); color: var(--teal-2); }
.tag.dr { background: var(--green-soft); color: var(--green); }
.leadin { font-size: 13.5px; color: var(--muted); background: var(--surface); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
.stem { font-family: var(--read); font-size: calc(18px * var(--fs)); line-height: 1.6; margin: 0 0 18px; }
.hint { font-size: 13px; color: var(--muted); margin: -8px 0 12px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 14px;
  font-size: calc(15.5px * var(--fs)); line-height: 1.45; transition: border-color .15s, background .15s;
}
.opt .l { width: 26px; height: 26px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-size: 13px; font-weight: 600; flex: none; margin-top: -1px; }
.opt.multi .l { border-radius: 6px; }
.opt[aria-pressed="true"] { border-color: var(--teal-2); background: var(--teal-soft); }
.opt[aria-pressed="true"] .l { background: var(--teal-2); color: #fff; }
.opt.correct { border-color: var(--green); background: var(--green-soft); }
.opt.correct .l { background: var(--green); color: #fff; }
.opt.wrong { border-color: var(--crimson); background: var(--crimson-soft); }
.opt.wrong .l { background: var(--crimson); color: #fff; }
.opt:disabled { cursor: default; }
.tf { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.tf.correct { border-color: var(--green); }
.tf.wrong { border-color: var(--crimson); }
.tf p { margin: 0 0 10px; font-size: calc(15.5px * var(--fs)); line-height: 1.45; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { padding: 9px; border-radius: 10px; background: var(--surface-2); font-weight: 500; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--teal-2); color: #fff; }
.tf.done .seg button[aria-pressed="true"].bad { background: var(--crimson); }
.tf.done .seg button.key { box-shadow: inset 0 0 0 2px var(--green); }
.tf .verdict { font-size: 12.5px; margin-top: 8px; color: var(--muted); }
.explain { margin-top: 20px; background: var(--surface); border-radius: 16px; padding: 16px; border-left: 4px solid var(--green); }
.explain.bad { border-left-color: var(--crimson); }
.explain .res { font-weight: 600; margin-bottom: 6px; }
.explain .res.ok { color: var(--green); }
.explain .res.no { color: var(--crimson); }
.explain p { font-family: var(--read); font-size: calc(15.5px * var(--fs)); line-height: 1.65; margin: 0 0 10px; }
.explain .src { font-size: 12.5px; color: var(--muted); }
.qtools { display: flex; justify-content: space-between; margin-top: 18px; gap: 8px; }
.qtools .left { display: flex; gap: 4px; }
.qtool { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 10px; color: var(--muted); font-size: 13px; font-weight: 500; }
.qtool svg { width: 18px; height: 18px; }
.qtool.on { color: var(--crimson); }
.qtool:active { background: var(--surface-2); }
figure.qimg { margin: 0 0 16px; }
figure.qimg img { max-width: 100%; border-radius: 12px; display: block; background: #fff; }

/* Action bar (browser mode) and tabs */
.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line);
}
.actionbar .btn { width: 100%; max-width: 608px; margin: 0 auto; display: flex; padding: 14px; font-size: 15.5px; }
.tg .actionbar { display: none; }
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 7px; font-size: 11.5px; color: var(--muted); font-weight: 500; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--teal-2); }

/* Stats and results */
.stat-line { font-size: 14px; color: var(--muted); }
.stat-line b { color: var(--ink); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border-radius: 16px; padding: 14px; }
.tile .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .k { color: var(--muted); font-size: 12.5px; }
.score { text-align: center; padding: 24px 0 8px; }
.score .big { font-family: var(--read); font-size: 56px; font-weight: 600; line-height: 1; }
.score p { color: var(--muted); margin: 8px 0 0; }
.choice { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
.choice button { padding: 8px 16px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--line); font-weight: 500; }
.choice button[aria-pressed="true"] { border-color: var(--teal-2); background: var(--teal-soft); color: var(--teal-2); }
.note { color: var(--muted); font-size: 13px; }
.about { font-size: 13px; color: var(--muted); line-height: 1.6; }
.mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 13px; font-weight: 700; color: #fff; }
.mark.ok { background: var(--green); } .mark.no { background: var(--crimson); } .mark.skip { background: var(--muted); }

/* Toast + sheet */
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 20;
  max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.2);
}
.scrim { position: fixed; inset: 0; background: rgba(6,20,22,.45); z-index: 15; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 640px; border-radius: 20px 20px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet h4 { margin: 0 0 4px; font-size: 17px; }
.sheet .note { margin: 0 0 12px; }
.radio { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 4px; text-align: left; border-bottom: 1px solid var(--line); }
.radio i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.radio[aria-pressed="true"] i { border: 6px solid var(--teal-2); }
.sheet .btns { display: flex; gap: 10px; margin-top: 16px; }
.sheet .btns .btn { flex: 1; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ================================================================
   CONFIG — the only lines you normally change
   ================================================================ */
const CONFIG = {
  APP_NAME: "MedMCQ",
  BOT_USERNAME: "YOUR_BOT",          // without @, used for share links
  CONTENT_BASE: null,                 // e.g. "https://content-1.<subdomain>.workers.dev" — null = built-in sample books
  IDLE_SECONDS: 180,                  // study timer pauses after 3 minutes without interaction
  MOCK_SECONDS_PER_QUESTION: 60,
};

/* ================================================================
   SAMPLE CONTENT — original sample questions for testing the app.
   Replaced automatically by your published packs when CONTENT_BASE is set.
   ================================================================ */
const SAMPLE = {
  catalog: {
    schema: 1,
    fields: [{ id: "medicine", title: "Medicine" }],
    specialties: [
      { id: "Anesthesiology", field: "medicine", color: "#16606A" },
      { id: "General Surgery", field: "medicine", color: "#7A3B52" },
      { id: "Cardiothoracic & Vascular Surgery", field: "medicine", color: "#A8323E" },
    ],
    books: [
      { id: "SAMPLE-PERIOP", title: "Perioperative Essentials", authors: ["Sample set"], specialty: "Anesthesiology",
        field: "medicine", collection_type: "textbook", version: 1, color: "#0F4C54", questions: 9,
        chapters: [{ id: 1, title: "Physiology", questions: 4 }, { id: 2, title: "Pharmacology", questions: 5 }] },
      { id: "SAMPLE-TRAUMA", title: "Trauma Essentials", authors: ["Sample set"], specialty: "General Surgery",
        field: "medicine", collection_type: "textbook", version: 1, color: "#6B3450", questions: 5,
        chapters: [{ id: 1, title: "Shock and trauma", questions: 5 }] },
      { id: "SAMPLE-CARDIO", title: "Cardiothoracic Essentials", authors: ["Sample set"], specialty: "Cardiothoracic & Vascular Surgery",
        field: "medicine", collection_type: "textbook", version: 1, color: "#8E2B35", questions: 4,
        chapters: [{ id: 1, title: "Cardiac surgery basics", questions: 4 }] },
    ],
    removed_books: [],
  },
  packs: {
    "SAMPLE-PERIOP:1": { schema: 1, book_id: "SAMPLE-PERIOP", chapter_id: 1, version: 1, questions: [
      { id: "Q000000001", type: "sba", stem: "What is the approximate resting cardiac output of a healthy 70 kg adult?",
        options: ["2 L/min", "5 L/min", "8 L/min", "10 L/min", "12 L/min"], answer: "B", no_shuffle: true,
        explanation: "Cardiac output = heart rate × stroke volume. About 70 beats/min × 70 mL gives roughly 5 L/min at rest.",
        source: "Sample set, question 1", status: "source_verified" },
      { id: "Q000000002", type: "sba", stem: "Which segment of the nephron reabsorbs the largest share of filtered sodium?",
        options: ["Proximal convoluted tubule", "Thick ascending limb of the loop of Henle", "Distal convoluted tubule", "Collecting duct", "Descending limb of the loop of Henle"], answer: "A",
        explanation: "About two-thirds of filtered sodium is reabsorbed in the proximal convoluted tubule. The thick ascending limb takes roughly a quarter.",
        source: "Sample set, question 2", status: "source_verified" },
      { id: "Q000000003", type: "mtf", stem: "The following shift the oxyhaemoglobin dissociation curve to the right:",
        options: ["A rise in temperature", "A rise in 2,3-DPG", "Alkalosis", "A rise in PaCO₂", "Carbon monoxide"], answer: ["T", "T", "F", "T", "F"],
        explanation: "A right shift lowers haemoglobin's affinity for oxygen and eases unloading: heat, acidosis, raised CO₂ and raised 2,3-DPG. Alkalosis and carbon monoxide shift the curve to the left.",
        source: "Sample set, question 3", status: "source_verified" },
      { id: "Q000000004", type: "sba", stem: "What is the normal intracranial pressure in a supine adult?",
        options: ["0–2 mmHg", "5–15 mmHg", "20–30 mmHg", "30–40 mmHg", "40–50 mmHg"], answer: "B", no_shuffle: true,
        explanation: "Normal intracranial pressure is about 5–15 mmHg in a supine adult. Sustained values above about 20–22 mmHg are generally treated as raised.",
        source: "Sample set, question 4", status: "source_verified" },
    ]},
    "SAMPLE-PERIOP:2": { schema: 1, book_id: "SAMPLE-PERIOP", chapter_id: 2, version: 1, questions: [
      { id: "Q000000005", type: "sba", stem: "Which drug reverses rocuronium by encapsulating it?",
        options: ["Neostigmine", "Sugammadex", "Atropine", "Naloxone", "Flumazenil"], answer: "B",
        explanation: "Sugammadex is a modified cyclodextrin that binds rocuronium (and vecuronium) directly. Neostigmine works differently, by inhibiting acetylcholinesterase.",
        source: "Sample set, question 5", status: "source_verified" },
      { id: "Q000000006", type: "sba", stem: "Which induction agent best maintains blood pressure in a haemodynamically unstable patient?",
        options: ["Propofol", "Thiopentone", "Ketamine", "Midazolam", "Methohexitone"], answer: "C",
        explanation: "Ketamine increases sympathetic outflow, which usually supports heart rate and blood pressure. Propofol and thiopentone commonly cause hypotension.",
        source: "Sample set, question 6", status: "source_verified" },
      { id: "Q000000007", type: "multi", stem: "Select two drugs that can trigger malignant hyperthermia.",
        options: ["Suxamethonium", "Propofol", "Sevoflurane", "Rocuronium", "Fentanyl"], answer: ["A", "C"],
        explanation: "The triggers are suxamethonium and the volatile anaesthetics, such as sevoflurane. Propofol, non-depolarising relaxants and opioids are safe.",

/* ================================================================
   Storage — IndexedDB with an in-memory fallback
   ================================================================ */
const DB = {
  db: null, mem: { packs: new Map(), meta: new Map() },
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("medmcq", 1);
        r.onupgradeneeded = () => { r.result.createObjectStore("packs"); r.result.createObjectStore("meta"); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch (e) { this.db = null; }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  },
  run(store, mode, fn) {
    if (!this.db) { return Promise.resolve(fn(null, this.mem[store])); }
    return new Promise((res, rej) => {
      try {
        const t = this.db.transaction(store, mode); const req = fn(t.objectStore(store));
        t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error);
      } catch (e) { rej(e); }
    });
  },
  get(s, k) { return this.run(s, "readonly", (st, m) => st ? st.get(k) : m.get(k)); },
  put(s, k, v) { return this.run(s, "readwrite", (st, m) => st ? st.put(v, k) : void m.set(k, v)); },
  del(s, k) { return this.run(s, "readwrite", (st, m) => st ? st.delete(k) : void m.delete(k)); },
  all(s) {
    if (!this.db) return Promise.resolve([...this.mem[s].entries()]);
    return new Promise((res, rej) => {
      const out = []; const t = this.db.transaction(s, "readonly");
      const cur = t.objectStore(s).openCursor();
      cur.onsuccess = () => { const c = cur.result; if (c) { out.push([c.key, c.value]); c.continue(); } };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error);
    });
  },
};

let CATALOG = null;

const DOWNLOADING = {};

async function loadCatalog() {
  if (CONFIG.CONTENT_BASE) {
    try {
      const r = await fetch(CONFIG.CONTENT_BASE + "/catalog.json", { cache: "no-cache" });
      if (r.ok) { const c = await r.json(); await DB.put("meta", "catalog", c); return c; }
    } catch (e) {}
    const cached = await DB.get("meta", "catalog");
    if (cached) return cached;
  }
  return SAMPLE.catalog;
}
async function fetchPack(bookId, chId) {
  const book = bookById(bookId); const ch = book.chapters.find((c) => c.id === chId);
  if (CONFIG.CONTENT_BASE && ch && ch.url) {
    const r = await fetch(ch.url); if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }
  await sleep(450);
  const p = SAMPLE.packs[bookId + ":" + chId];
  if (!p) throw new Error("missing pack");
  return JSON.parse(JSON.stringify(p));
}
function indexPack(p) { for (const q of p.questions) QI[q.id] = { q, b: p.book_id, ch: p.chapter_id }; }
function unindexPack(p) { for (const q of p.questions) delete QI[q.id]; }
async function downloadChapter(bookId, chId, quiet) {
  const key = bookId + ":" + chId;
  if (PACKS[key]) return PACKS[key];
  if (DOWNLOADING[key]) return DOWNLOADING[key];
  const job = (async () => {
    try {
      const pack = await fetchPack(bookId, chId);
      await DB.put("packs", key, pack);
      PACKS[key] = pack; indexPack(pack);
      S.dl[key] = { v: pack.version, size: JSON.stringify(pack).length, at: Date.now() };
      saveState();
      return pack;
    } catch (e) {
      if (!quiet) toast("Download failed. Check your connection and try again.");
      return null;
    } finally { delete DOWNLOADING[key]; render(); }
  })();
  DOWNLOADING[key] = job; render();
  return job;
}
async function deleteChapter(key) {
  const p = PACKS[key]; if (p) unindexPack(p);
  delete PACKS[key]; delete S.dl[key];
  await DB.del("packs", key).catch(() => {});
  saveState();
}
function bookStats(book) {
  let answered = 0, correct = 0;
  for (const id in S.answers) { const a = S.answers[id]; if (a.b === book.id) { answered++; if (a.c) correct++; } }
  return { answered, correct, pct: book.questions ? Math.min(100, Math.round((answered / book.questions) * 100)) : 0 };
}
function totals() {
  const vals = Object.values(S.answers); const answered = vals.length; const correct = vals.filter((a) => a.c).length;
  return { answered, correct, acc: answered ? Math.round((correct / answered) * 100) : 0 };
}
function streak() {
  let n = 0; const d = new Date();
  if (!S.active[dayKey(d)]) d.setDate(d.getDate() - 1);
  while (S.active[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }

}

   ================================================================ */
function newResp(q) {
  return { sel: q.type === "mtf" ? q.options.map(() => null) : q.type === "multi" ? [] : null, done: false, correct: false, score: 0 };
}
function startSession(opts) {
  SESSION = Object.assign({ mode: "study", title: "", qids: [], index: 0, resp: {}, order: {}, startedAt: Date.now(), finished: false }, opts);
  if (SESSION.mode === "exam") SESSION.deadline = Date.now() + SESSION.qids.length * CONFIG.MOCK_SECONDS_PER_QUESTION * 1000;
  go("study");
}
async function startChapter(bookId, chId, qid) {
  let pack = PACKS[bookId + ":" + chId];
  if (!pack) pack = await downloadChapter(bookId, chId);
  if (!pack) return;
  const qids = pack.questions.map((q) => q.id);
  let index = qid ? Math.max(0, qids.indexOf(qid)) : qids.findIndex((id) => !S.answers[id]);
  if (index < 0) index = 0;
  const ch = bookById(bookId).chapters.find((c) => c.id === chId);
  startSession({ mode: "study", title: ch ? ch.title : "Chapter", qids, index, bookId, chId });
}
function orderFor(q) {
  if (!SESSION.order[q.id]) {
    const idx = q.options.map((_, i) => i);
    SESSION.order[q.id] = q.no_shuffle || q.type === "emq" ? idx : shuffle(idx);
  }
  return SESSION.order[q.id];
}
function isComplete(q, r) {
  if (q.type === "mtf") return r.sel.every((v) => v === "T" || v === "F");
  if (q.type === "multi") return r.sel.length === q.answer.length;
  return r.sel !== null;
}
function grade(q, r) {
  if (q.type === "mtf") {
    let k = 0; q.answer.forEach((v, i) => { if (r.sel[i] === v) k++; });
    r.score = k / q.answer.length; r.correct = k === q.answer.length;
  } else if (q.type === "multi") {
    const key = q.answer.map(L2I).sort().join(","); r.correct = r.sel.slice().sort().join(",") === key; r.score = r.correct ? 1 : 0;
  } else {
    r.correct = r.sel === L2I(q.answer); r.score = r.correct ? 1 : 0;
  }
}
function recordAnswer(q, r) {
  const info = QI[q.id]; const prev = S.answers[q.id];
  S.answers[q.id] = { c: r.correct, n: (prev ? prev.n : 0) + 1, t: Date.now(), b: info ? info.b : SESSION.bookId };
  S.active[dayKey()] = true;
  saveState();
}
function submitCurrent() {
  const qid = SESSION.qids[SESSION.index]; const q = QI[qid].q; const r = SESSION.resp[qid];
  if (!r || r.done || !isComplete(q, r)) return;
  grade(q, r); r.done = true; recordAnswer(q, r);
  if (SESSION.mode === "exam") { haptic.tap(); nextQuestion(); return; }
  r.correct ? haptic.ok() : haptic.no();
  render();
  requestAnimationFrame(() => { const ex = $(".explain"); if (ex) ex.scrollIntoView({ behavior: "smooth", block: "nearest" }); });
}
function nextQuestion() {
  if (SESSION.index < SESSION.qids.length - 1) { SESSION.index++; render(true); return; }
  if (SESSION.mode === "exam") { finishExam(); return; }
  toast(SESSION.mode === "study" ? "Chapter finished." : "Review finished.");
  const parent = SESSION.parent; STACK.pop(); SESSION = parent || null; render(true);
}
function finishExam() {
  if (!SESSION || SESSION.finished) return;
  SESSION.finished = true; SESSION.endedAt = Date.now();
  STACK[STACK.length - 1] = { v: "results", p: {} }; render(true);
}

   ================================================================ */
function startPractice(list) {
  const ids = list === "mistakes" ? mistakes() : favorites();
  if (!ids.length) { toast(list === "mistakes" ? "No mistakes to review. Nice." : "Star questions while you study to collect them here."); return; }
  startSession({ mode: "review", title: list === "mistakes" ? "My mistakes" : "Starred questions", qids: ids });
}
function startMock() {
  const all = shuffle(Object.keys(QI)); const n = MOCK_N ? Math.min(MOCK_N, all.length) : all.length;
  startSession({ mode: "exam", title: "Mock exam", qids: all.slice(0, n) });
}
function reviewExam(i) {
  const src = SESSION; const resp = {};
  for (const id of src.qids) resp[id] = src.resp[id] ? Object.assign({}, src.resp[id]) : Object.assign(newResp(QI[id].q), { done: true, correct: false });
  SESSION = { mode: "review-exam", title: "Exam review", qids: src.qids, index: i, resp, order: src.order, startedAt: Date.now(), finished: true, parent: src };
  go("study");
}
